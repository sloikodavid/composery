name: mobile-preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/mobile/**
      - packages/shared/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-preview.yml

permissions:
  contents: read

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A fresh fork does not fail every push before its Expo account exists.
    # Manual runs always work; setting MOBILE_PREVIEW_ENABLED=true makes mobile
    # changes on main produce an APK automatically.
    if: github.event_name == 'workflow_dispatch' || vars.MOBILE_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: mobile-preview
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile check
      - run: pnpm --filter mobile build

      - name: Build preview APK
        run: |
          # The default shell is `bash -e` without pipefail, so every
          # `apksigner|aapt ... | tee` below would report success on a failed
          # verify - the one thing this step exists to catch.
          set -euo pipefail
          mkdir -p tmp
          pnpm --filter mobile eas -- build --platform android \
            --profile preview --non-interactive --wait --json \
            > tmp/mobile-preview-build.json

          apk_url="$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' tmp/mobile-preview-build.json)"
          if [[ ! "$apk_url" =~ ^https:// ]]; then
            echo "EAS did not return an HTTPS APK URL." >&2
            cat tmp/mobile-preview-build.json >&2
            exit 1
          fi
          curl --fail --location --retry 3 "$apk_url" --output tmp/composery-preview.apk

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs tmp/composery-preview.apk \
            | tee tmp/mobile-preview-apksigner.txt
          "$build_tools/aapt" dump badging tmp/composery-preview.apk \
            | tee tmp/mobile-preview-badging.txt
          "$build_tools/aapt" dump permissions tmp/composery-preview.apk \
            | tee tmp/mobile-preview-permissions.txt
          grep -F "package: name='io.composery'" tmp/mobile-preview-badging.txt
          mapfile -t active_permissions < <(sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" tmp/mobile-preview-permissions.txt | sort -u)
          expected_permissions=(
            android.permission.ACCESS_NETWORK_STATE
            android.permission.CAMERA
            android.permission.INTERNET
            android.permission.VIBRATE
            io.composery.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          )
          if [[ "${active_permissions[*]}" != "${expected_permissions[*]}" ]]; then
            echo "Unexpected APK permissions: ${active_permissions[*]}" >&2
            exit 1
          fi
          sha256sum tmp/composery-preview.apk > tmp/composery-preview.apk.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composery-preview-${{ github.sha }}
          path: |
            tmp/composery-preview.apk
            tmp/composery-preview.apk.sha256
            tmp/mobile-preview-build.json
            tmp/mobile-preview-apksigner.txt
            tmp/mobile-preview-badging.txt
            tmp/mobile-preview-permissions.txt
          retention-days: 14
          if-no-files-found: error
