name: smoke

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      no_cache:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # A hang detector, not a budget - and not optional either: leaving it off
    # takes GitHub's default of 360, so a wedged job burns six hours of runner
    # time and a concurrency slot. Sized against what the work is (a full image
    # build plus the suite, ~20 minutes on these runners), far enough above it
    # that a loaded runner is never mistaken for a broken one. A test pins the
    # floor, because the failure mode of a tight one is a healthy job reported
    # as a failure.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Runners are ephemeral; the fixed tag only needs to be stable enough for
      # the Trivy step below. smoke.mjs dumps diagnostics and cleans up itself.
      SMOKE_IMAGE_TAG: composery:smoke
      SMOKE_NO_CACHE: ${{ inputs.no_cache || false }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Smoke-test image
        run: pnpm system:smoke
      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: matrix.arch == 'amd64'
        with:
          image-ref: ${{ env.SMOKE_IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          # Informational: release.yaml rescans the exact published digest and owns
          # the one persistent SARIF report. Validation only logs findings, since
          # a report write belongs after the promotion boundary.
          exit-code: "0"
