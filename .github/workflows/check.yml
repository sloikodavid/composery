name: check

on:
  push:
  pull_request:

jobs:
  check:
    # What differs between platforms is this repository's own code and the tools that read it:
    # path handling, line endings, what a shell does with a script. Linux runs the same checks
    # inside `verify`, so this is the other two.
    #
    # Not the tests, and not quietly: they need Docker, which a hosted macOS runner has not, so a
    # run here would report on the runner rather than on the code. Not the build either, because
    # `verify` is the only thing that builds and there is no script that builds alone; one added
    # for CI would be a path nobody runs before pushing, which is how CI and a working copy drift.
    name: check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cp .env.local.example .env.local
        shell: bash
      - run: bun check
