name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    # Linux runs everything, including the tests that need Docker; docs/requirements.md says what
    # a machine needs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
        # The app's own configuration, in the shape the checks and the build read it.
      - run: cp .env.local.example .env.local
        # The same command a person runs before pushing: the checks, the tests, and the build.
      - run: bun verify
