name: verify

on:
  push:
  pull_request:

# A later push replaces an earlier one: only the newest commit has to be proved.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Linux runs the tests that need Docker; docs/requirements.md says what a machine needs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
        # The same command a person runs before pushing: the checks, the tests, and the build.
      - run: bun verify
        env:
          # The build needs the values the browser is given. Nothing here reaches a real deployment:
          # the tests build their own, and this only has to be the shape the app reads at build time.
          NEXT_PUBLIC_CONVEX_URL: https://verify.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://verify.convex.site
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dmVyaWZ5LmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_FRONTEND_API_URL: https://verify.clerk.accounts.dev
