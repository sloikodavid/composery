name: mutants

# The full mutation sweep. ci.yaml gates every pull request on the mutants in its
# own diff, which is fast and catches new tests that cannot fail; this is the
# other half - the standing score over code nobody has touched lately, which is
# exactly where a test that stopped meaning anything goes unnoticed.
#
# Nightly and on demand. A sweep runs the suite once per surviving mutant across
# both languages and is measured in hours, so it can never be a per-PR gate.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    # No timeout-minutes on purpose. A hang detector works when the real runtime
    # is known and much smaller than the cap - smoke does ~20 minutes under 120,
    # so two hours means wedged. A sweep's runtime scales with the codebase and
    # nobody has measured this one yet, so any number here would be a budget
    # dressed as a detector: it cannot tell "hung" from "working". GitHub's own
    # 360-minute ceiling applies regardless. Measure the first green sweep, then
    # set a real detector at a few times that - or shard the work so the runtime
    # is knowable (`--concurrency`, splitting the mutate globs, `--shard`).
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `--break` comes from stryker.config.json, which is the ratchet: raise it
      # when the score rises, never lower it to make a red run green.
      - name: Sweep
        run: pnpm exec stryker run
      # The html report, not `tempDirName`. That directory is the sandbox Stryker
      # mutates in and deletes on success, so this step used to upload nothing at
      # all on a green sweep and a tree of mutated copies on a red one - with
      # `if-no-files-found: ignore` keeping it quiet either way. The survivor list
      # is the only output of a sweep that anyone acts on, so it must fail loudly
      # when it is missing.
      - name: Upload the survivor list
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report
          path: tmp/mutants/stryker.html
          if-no-files-found: error
          retention-days: 14

  rust:
    runs-on: ubuntu-24.04
    # Unbounded for the same reason as the TypeScript job above.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/cli
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Sweep
        run: cargo mutants --manifest-path packages/cli/Cargo.toml --no-times
      - name: Upload the survivor list
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-mutants-report
          path: packages/cli/mutants.out
          if-no-files-found: error
          retention-days: 14
