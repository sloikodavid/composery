name: mobile-e2e

# Drives the native mobile shell on a real Android emulator and a real iOS
# simulator, so the two platforms Composery is *used* from are covered by
# something that actually boots the app rather than only bundling it.
#
# Both jobs build the Release configuration with `expo run:*`. This exercises
# the embedded bundle and production native config without Expo Go, Metro, or
# development-client permissions that the store binary will not have.
#
# Nightly and on demand, never on pull requests: a native build plus an emulator
# boot is slow and device runs are the flakiest thing in any suite. Bundling for
# both platforms is already a per-PR gate in ci.yml (`pnpm build:mobile`).
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The dev/EAS build id, per app.json. Flows take it as ${APP_ID} so the same
  # file drives Expo Go or a real build on either platform.
  APP_ID: io.composery

jobs:
  android:
    runs-on: ubuntu-24.04
    # 60 was a budget, and the work outgrew it: a Gradle release build, an
    # emulator boot and a Maestro run stopped fitting, so a healthy build was
    # cancelled mid-step and reported as a failed nightly. See smoke.yml for
    # why this is a hang detector and why it cannot simply be removed. If this
    # is ever reached again the answer is caching Gradle and the AVD, not a
    # bigger number - at that point it really is too slow.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Not Renovate-managed on purpose: this tracks the Java the Android Gradle
      # Plugin requires, not the newest JDK. Raise it when AGP does.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile

      - name: Install Maestro
        run: |
          sh .github/scripts/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM is what makes the emulator usable rather than glacially slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and drive the app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Also unmanaged: an emulator API level tracks the app's target SDK
          # (app.json / Expo), not a package registry.
          api-level: 35
          arch: x86_64
          working-directory: packages/mobile
          # The action runs this with `sh -c`, which is dash on the runner: `set
          # -o pipefail` is a hard parse error there, not a no-op, so the whole
          # script died before the first command. Nothing below pipes, so `-eu`
          # is the entire guarantee either shell would give.
          script: |
            set -eu
            node scripts/test-instance.mjs &
            pnpm exec expo run:android --variant release --no-bundler
            maestro test -e APP_ID="$APP_ID" \
              -e INSTANCE_URL="http://10.0.2.2:4173" --format junit \
              --output ../../maestro-android.xml tests/system/e2e.yml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-android
          path: |
            maestro-android.xml
            ~/.maestro/tests/**

  ios:
    # Unmanaged like every runner label, but load-bearing here: this picks the
    # Xcode, and macos-15's default (16.4) cannot resolve the package graph Expo
    # SDK 57 / React Native 0.86 produce - `expo run:ios` died in "Prepare
    # packages" before compiling anything. ci.yml's macos-15 job only bundles
    # with Metro, so it is unaffected and stays on the GA image.
    runs-on: macos-26
    # Same number as android on purpose: one rule, no per-job budget to remember.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Maestro
        run: |
          sh .github/scripts/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build and drive the app
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          node scripts/test-instance.mjs &
          # Boots a simulator, prebuilds the gitignored iOS project, and installs
          # the same Release configuration the store build uses.
          pnpm exec expo run:ios --configuration Release --no-bundler
          maestro test -e APP_ID="$APP_ID" \
            -e INSTANCE_URL="http://127.0.0.1:4173" --format junit \
            --output ../../maestro-ios.xml tests/system/e2e.yml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-ios
          path: |
            maestro-ios.xml
            ~/.maestro/tests/**
