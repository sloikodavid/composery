name: contracts

# The only thing here that reaches a vendor. A description changing is not a broken commit, so it
# is a job of its own: it fails on the day the vendor moves, whoever pushed last.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun contracts
      - name: Report what moved
        run: |
          if ! git diff --quiet -- contracts; then
            echo "A vendor changed what it says about itself. Read the difference, then commit it:"
            git --no-pager diff -- contracts
            exit 1
          fi
