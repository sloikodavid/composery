name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Keep the privileged boundary out of pull-request CI. This workflow can only
  # observe a direct main-branch CI run from this repository; it never executes
  # code from an untrusted head with its write token.
  production:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the green commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      # `deploy` is a release pointer, not a development branch. Vercel tracks
      # it as Production and packages/web/vercel.json rejects every other Git
      # branch. A normal push is deliberately non-forced: if anything moved the
      # pointer away from main's linear history, deployment stops visibly.
      - name: Advance production
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: git push origin "$COMMIT:refs/heads/deploy"
