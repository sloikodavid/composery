name: smoke

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      no_cache:
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # A hang detector, not a budget - and not optional either: leaving it off
    # takes GitHub's default of 360, so a wedged job burns six hours of runner
    # time and a concurrency slot. Sized against what the work is (a full image
    # build plus the suite, ~20 minutes on these runners), far enough above it
    # that a loaded runner is never mistaken for a broken one. A test pins the
    # floor, because the failure mode of a tight one is a healthy job reported
    # as a failure - which is exactly what a budget-sized 60 did to mobile-e2e.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Runners are ephemeral; the fixed tag only needs to be stable enough for
      # the Trivy step below. smoke.mjs dumps diagnostics and cleans up itself.
      SMOKE_IMAGE_TAG: composery:smoke
      SMOKE_NO_CACHE: ${{ inputs.no_cache || false }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Smoke-test image
        run: pnpm smoke
      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: matrix.arch == 'amd64'
        with:
          image-ref: ${{ env.SMOKE_IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          # Informational: release.yml rescans the exact published digest and owns
          # the one persistent SARIF report. Validation only logs findings, since
          # a report write belongs after the promotion boundary.
          exit-code: "0"
