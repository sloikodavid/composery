name: smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      no_cache:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      no_cache:
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # A hang detector, not a budget - and not optional either: leaving it off
    # takes GitHub's default of 360, so a wedged job burns six hours of runner
    # time and a concurrency slot. Sized against what the work is (a full image
    # build plus the suite, ~20 minutes on these runners), far enough above it
    # that a loaded runner is never mistaken for a broken one. A test pins the
    # floor, because the failure mode of a tight one is a healthy job reported
    # as a failure - which is exactly what a budget-sized 60 did to mobile-e2e.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Runners are ephemeral; the fixed tag only needs to be stable enough for
      # the Trivy step below. smoke.mjs dumps diagnostics and cleans up itself.
      SMOKE_IMAGE_TAG: composery:smoke
      SMOKE_NO_CACHE: ${{ inputs.no_cache || false }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Run smoke suite
        run: pnpm smoke
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: matrix.arch == 'amd64'
        with:
          image-ref: ${{ env.SMOKE_IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Informational: findings surface as SARIF code-scanning alerts here and
          # in release.yml (which rescans the exact published digest); neither scan
          # blocks, since unfixed base-image CVEs would brick every PR and release.
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@5e316336eb4f107009e477d4bfbfff13d7250fae # v4
        if: >-
          always() &&
          matrix.arch == 'amd64' &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif
