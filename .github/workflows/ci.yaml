name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to validate.
        type: string
        default: ""

permissions:
  contents: read

# `github.workflow` is the calling workflow's name, so a validation run nested
# inside a release never shares a group with a push-triggered run of this file.
# Relying on `inputs.ref` alone to separate them worked only because "main" and
# "refs/heads/main" happen to spell differently.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that must hold on any developer's machine, on the two OSes the
  # `linux` job cannot speak for. Runs `check:portable` rather than a step list,
  # so a new check:* target is covered here the day it is added; a test pins that
  # script to the check:* family so nothing can quietly opt out.
  # Excluded on purpose: check:cli (persistence needs inotify/xattr, so cargo
  # only runs on Linux or in the Rust container) and check:renovate (validates
  # JSON against a schema - no OS-specific behaviour to catch).
  # Named for the OS rather than the script: this job also builds, so `portable`
  # would name only its first step.
  windows-macos:
    name: checks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spans both non-Linux host OSes and both architectures: windows-2025 is
        # x64 and macos-15 is arm64. Ubuntu x64 runs the same portable target in
        # the linux job below.
        os: [windows-2025, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository
        run: pnpm check:portable
      # The two artifacts a contributor builds from their own machine. The image
      # (build:image) is Linux-only by nature and stays on the linux job.
      - name: Build website
        run: pnpm build:web
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.invalid
  # Everything the other job cannot run: the full check + build set, plus the
  # Linux-only gates (workflow lint, quilt patch stack, cargo, image build).
  linux:
    name: checks / linux
    # GA image. ubuntu-26.04 exists but is public preview (June 2026, no GA date)
    # - preview images change without a deprecation window, and this job gates
    # releases. Move when it goes GA.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          # check:coverage and check:mutants both diff against the fork point, and
          # a shallow clone has no fork point to find. Both refuse to run rather
          # than report a pass over nothing, so this is what keeps them honest.
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Validates every workflow, and runs shellcheck over each `run:` block -
      # the CI files are the one part of the repo `pnpm check` cannot see.
      # Needs no config: every label this repo runs on is in actionlint's own
      # list, so a typo'd or retired one fails here.
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-lfs
      # No patch-stack gate here on purpose. A hand-written quilt push in this
      # file was a third copy of build.sh's assembly and drifted from it: build.sh
      # moved our patches into a composery/ subdirectory (our clipboard.diff had
      # been silently replacing code-server's), this copy kept the flat cp, and CI
      # failed on "already applied" while the image built fine. The rehearsal now
      # lives in check:test, where it reads build.sh's own assembly rules, and the
      # real stack is applied by build.sh itself during `pnpm build` below.
      # The one action ref that cannot carry a SHA: this action picks the
      # toolchain from its own @rev, so the version tag is the input. Renovate
      # tracks it in the "rust toolchain" group; a test pins Cargo's floor to it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      # Before the install below, not after it, which is the order mutants.yaml
      # already uses. This action restores `~/.cargo/bin` on entry and saves it
      # after the job, so running it second meant cargo-mutants was compiled from
      # source on every run and the result thrown away - minutes on the one job
      # every pull request waits for.
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/cli
      # The Rust half of check:mutants. Installed here rather than by the script:
      # a missing binary makes that script exit non-zero instead of skipping, so
      # the gate cannot go quiet by losing a tool.
      # Unpinned on purpose, and one of the few things here that is: cargo-mutants
      # is a developer tool whose output we read, not a dependency of anything we
      # ship, so tracking crates.io is what we want and there is no artifact for a
      # digest to protect. `--locked` keeps its own dependency resolution fixed.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # A check can accidentally become inert while its fixer remains correct.
      # Run every canonical writer, then reject any tracked or untracked source
      # change it found. Ignored build output is intentionally outside the
      # repository contract.
      - name: Check for source drift
        run: |
          set -euo pipefail
          pnpm fix
          git diff --exit-code --ignore-submodules=dirty HEAD --
          if [[ -n "$(git status --porcelain --untracked-files=all --ignore-submodules=dirty)" ]]; then
            echo "Canonical generators left untracked source files:" >&2
            git status --short --untracked-files=all --ignore-submodules=dirty >&2
            exit 1
          fi
      - name: Check repository
        run: pnpm check
      - name: Check provider contracts
        run: pnpm system:providers

      - name: Check the registry client
        run: pnpm system:registry

      - name: Validate runtime artifacts
        run: pnpm system:artifacts
      # Run the whole build so every build:* target is covered with no list here to
      # drift. Catches bundling errors tsc can't (web's SSR/prerender, e.g.
      # ConvexReactClient's URL validation) and builds the
      # image; smoke.yaml is what boots and exercises it. No real secret needed:
      # nothing here reads a runtime value.
      - name: Build website and image
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.invalid

  smoke:
    uses: ./.github/workflows/smoke.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}

  templates:
    uses: ./.github/workflows/templates.yaml

  # One fail-closed result for consumers that must not learn the growing set of
  # validation jobs. `always()` makes a failed, cancelled, or skipped dependency
  # produce a red check instead of a skipped check that some external systems
  # interpret as acceptable.
  all-checks:
    name: all checks
    if: always()
    needs:
      - windows-macos
      - linux
      - smoke
      - templates
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm every check passed
        env:
          LINUX: ${{ needs.linux.result }}
          PORTABLE: ${{ needs.windows-macos.result }}
          SMOKE: ${{ needs.smoke.result }}
          TEMPLATES: ${{ needs.templates.result }}
        run: |
          set -euo pipefail
          printf 'linux=%s\nportable=%s\nsmoke=%s\ntemplates=%s\n' "$LINUX" "$PORTABLE" "$SMOKE" "$TEMPLATES"
          [[ "$LINUX" == "success" ]]
          [[ "$PORTABLE" == "success" ]]
          [[ "$SMOKE" == "success" ]]
          [[ "$TEMPLATES" == "success" ]]
