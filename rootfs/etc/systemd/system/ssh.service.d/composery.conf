# Composery gates SSH on one decision, shared with the supervisor profile, and
# generates the host keys before sshd looks for them. ExecCondition is the systemd
# primitive for the gate: a non-zero exit leaves the unit inactive rather than
# marking it failed and retrying.
[Service]
# systemd starts units with a clean environment, so the gate would never see
# COMPOSERY_DISABLE_SSH without this - it would read as unset and SSH would run
# on an instance configured to have none.
EnvironmentFile=-/run/composery.env
ExecCondition=/opt/composery/ssh.sh check
ExecStartPre=/opt/composery/ssh.sh prepare
