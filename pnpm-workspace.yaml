packages:
  - packages/*

# Single-source the versions shared across packages so they can't drift (web/mobile/root
# had already diverged on vitest, @types/node, concurrently). Reference as "catalog:".
catalog:
  "@types/node": 24.13.2
  "@types/react": ^19.2.15
  concurrently: ^10.0.3
  eslint: 9.39.4
  prettier: 3.8.3
  typescript: 6.0.3
  vitest: 4.1.10

patchedDependencies:
  fumadocs-mdx@15.0.12: packages/web/patches/fumadocs-mdx@15.0.12.patch
  fumadocs-ui@16.10.4: packages/web/patches/fumadocs-ui@16.10.4.patch

# @clerk/nextjs@7.4.2 and @clerk/ui@1.14.0 are pinned, but their @clerk/* deps
# float on caret ranges. A fresh resolve floats them past what @clerk/ui@1.14.0
# was built against (it imports an internal hook @clerk/shared dropped after
# 4.14.0). Pin the whole set to the versions the standalone website shipped with.
overrides:
  "@clerk/shared": 4.14.0
  "@clerk/react": 6.7.2
  "@clerk/backend": 3.4.14
  "@clerk/localizations": 4.7.0

peerDependencyRules:
  allowedVersions:
    "ws@7>utf-8-validate": "6"
    "@gorhom/bottom-sheet>react-native-reanimated": "4.5.0"

allowBuilds:
  "@clerk/shared": true
  "@tailwindcss/oxide": true
  cpu-features: true
  esbuild: true
  sharp: true
  ssh2: true
  unrs-resolver: true
  bufferutil: false
  core-js: false
  msw: false
  utf-8-validate: false
  dtrace-provider: false
