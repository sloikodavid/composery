<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Theme</title>
		<style>
			* {
				box-sizing: border-box;
			}
			:root {
				color-scheme: dark;
				font:
					13px/1.45 Inter,
					ui-sans-serif,
					system-ui,
					sans-serif;
				background: #151619;
				color: #eceef1;
			}
			body {
				margin: 0;
			}
			button,
			input {
				font: inherit;
			}
			button {
				color: inherit;
			}
			.toolbar {
				position: sticky;
				top: 0;
				z-index: 10;
				display: flex;
				min-height: 54px;
				align-items: center;
				gap: 16px;
				padding: 8px 14px;
				border-bottom: 1px solid #303239;
				background: #1b1d21;
			}
			h1 {
				margin: 0 auto 0 0;
				font-size: 16px;
				font-weight: 650;
			}
			.segment {
				display: flex;
				gap: 2px;
				padding: 3px;
				border: 1px solid #373a42;
				border-radius: 8px;
				background: #141519;
			}
			.segment button,
			#save {
				min-height: 30px;
				padding: 5px 10px;
				border: 0;
				border-radius: 5px;
				background: transparent;
				cursor: pointer;
			}
			.segment button[aria-pressed="true"] {
				background: #30333a;
			}
			#save {
				min-width: 64px;
				background: #eceef1;
				color: #151619;
				font-weight: 650;
			}
			#save:disabled {
				opacity: 0.55;
			}
			.layout {
				display: grid;
				grid-template-columns: 350px minmax(640px, 1fr);
				min-height: calc(100vh - 54px);
			}
			.controls {
				padding: 16px 14px 40px;
				border-right: 1px solid #303239;
				background: #1b1d21;
			}
			.group + .group {
				margin-top: 22px;
			}
			.group h2 {
				margin: 0 0 7px;
				color: #a9adb7;
				font-size: 11px;
				font-weight: 650;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.role {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 30px 94px;
				align-items: center;
				gap: 7px;
				min-height: 34px;
			}
			.role-name {
				overflow: hidden;
				color: #d8dbe1;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.role[data-source="web"] .role-name::after {
				content: " · shared";
				color: #777d89;
			}
			input[type="color"] {
				width: 30px;
				height: 26px;
				padding: 2px;
				border: 1px solid #41444d;
				border-radius: 5px;
				background: #101115;
			}
			input[type="text"] {
				width: 94px;
				height: 27px;
				padding: 3px 6px;
				border: 1px solid #41444d;
				border-radius: 5px;
				outline: none;
				background: #101115;
				color: #eceef1;
				font:
					12px/1.2 ui-monospace,
					"SFMono-Regular",
					Consolas,
					monospace;
			}
			input[type="text"]:focus {
				border-color: #8b91a0;
			}
			input[type="text"].invalid {
				border-color: #ef6464;
				color: #ff8585;
			}
			#status {
				min-height: 20px;
				margin: 16px 0 0;
				color: #989da8;
			}
			#status.error {
				color: #ff8585;
			}
			.stage {
				min-width: 0;
				overflow: auto;
				padding: 24px;
				background: #111216;
			}
			.caption {
				margin: 0 auto 9px;
				max-width: 1120px;
				color: #8f949f;
				font-size: 11px;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			.preview {
				max-width: 1120px;
				margin: 0 auto;
				overflow: hidden;
				border: 1px solid #373a42;
				border-radius: 10px;
				box-shadow: 0 18px 55px #0000004d;
			}

			/* Website preview: shapes mirror the real primitives without copying a page. */
			.site {
				min-height: 720px;
				background: var(--background);
				color: var(--foreground);
				font-size: 14px;
			}
			.site-header {
				display: flex;
				height: 58px;
				align-items: center;
				gap: 8px;
				padding: 0 22px;
				border-bottom: 1px solid var(--border);
				background: var(--background);
			}
			.brand {
				margin-right: auto;
				font-size: 16px;
				font-weight: 700;
			}
			.site-button {
				display: inline-flex;
				height: 32px;
				align-items: center;
				justify-content: center;
				padding: 0 13px;
				border: 1px solid transparent;
				border-radius: 18px;
				font-weight: 600;
			}
			.site-button.primary {
				background: var(--primary);
				color: var(--primary-foreground);
			}
			.site-button.outline {
				border-color: var(--border);
				background: var(--background);
			}
			.site-button.secondary {
				background: var(--secondary);
				color: var(--secondary-foreground);
			}
			.site-button.destructive {
				background: color-mix(in srgb, var(--destructive) 12%, transparent);
				color: var(--destructive);
			}
			.site-button.ghost {
				background: color-mix(in srgb, var(--foreground) 6%, transparent);
			}
			.hero {
				padding: 42px 32px 30px;
				text-align: center;
			}
			.eyebrow {
				color: var(--info);
				font-size: 12px;
				font-weight: 650;
			}
			.hero h2 {
				max-width: 720px;
				margin: 8px auto;
				font-size: 34px;
				line-height: 1.08;
				letter-spacing: -0.035em;
			}
			.hero p {
				max-width: 600px;
				margin: 0 auto 18px;
				color: var(--muted-foreground);
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 8px;
			}
			.hero .row {
				justify-content: center;
			}
			.site-content {
				display: grid;
				grid-template-columns: minmax(0, 1.6fr) minmax(260px, 0.8fr);
				gap: 18px;
				padding: 0 24px 28px;
			}
			.site-card {
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 22px;
				background: var(--card);
				color: var(--card-foreground);
			}
			.card-pad {
				padding: 20px;
			}
			.card-title {
				font-size: 16px;
				font-weight: 650;
			}
			.muted {
				color: var(--muted-foreground);
			}
			.status {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 12px;
				font-weight: 600;
			}
			.status::before {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: currentColor;
				content: "";
			}
			.success {
				color: var(--success);
			}
			.warning {
				color: var(--warning);
			}
			.destructive-text {
				color: var(--destructive);
			}
			.info {
				color: var(--info);
			}
			.metrics {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				margin: 18px 0;
			}
			.metric {
				padding: 12px;
				border-radius: 14px;
				background: var(--muted);
			}
			.metric b {
				display: block;
				margin-top: 3px;
				font-size: 18px;
			}
			.chart {
				display: flex;
				height: 54px;
				align-items: end;
				gap: 7px;
				margin: -4px 0 18px;
				padding: 8px 10px 0;
				border-bottom: 1px solid var(--border);
			}
			.chart i {
				flex: 1;
				min-width: 10px;
				border-radius: 3px 3px 0 0;
			}
			.site-input {
				height: 32px;
				flex: 1;
				min-width: 150px;
				padding: 0 12px;
				border: 1px solid var(--input);
				border-radius: 16px;
				background: var(--background);
				color: var(--foreground);
				box-shadow: 0 0 0 1px transparent;
			}
			.site-input.focused {
				border-color: var(--ring);
				box-shadow: 0 0 0 1px var(--ring);
			}
			.table {
				border-top: 1px solid var(--border);
			}
			.table-row {
				display: grid;
				grid-template-columns: minmax(130px, 1fr) 110px 100px;
				align-items: center;
				min-height: 48px;
				padding: 0 20px;
				border-bottom: 1px solid var(--border);
			}
			.table-row:last-child {
				border-bottom: 0;
			}
			.table-head {
				min-height: 38px;
				color: var(--muted-foreground);
				font-size: 12px;
			}
			.stack {
				display: grid;
				gap: 18px;
			}
			.popover {
				padding: 8px;
				border: 1px solid var(--border);
				border-radius: 18px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 12px 32px
					color-mix(in srgb, var(--overlay) 55%, transparent);
			}
			.menu-item {
				padding: 8px 10px;
				border-radius: 12px;
			}
			.menu-item.selected {
				background: var(--accent);
				color: var(--accent-foreground);
			}
			.menu-separator {
				height: 1px;
				margin: 5px -2px;
				background: var(--border);
			}
			.toast {
				display: grid;
				grid-template-columns: 18px 1fr;
				gap: 9px;
				padding: 14px;
				border: 1px solid var(--border);
				border-radius: 14px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 10px 28px
					color-mix(in srgb, var(--overlay) 45%, transparent);
			}
			.dialog-demo {
				position: relative;
				min-height: 210px;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 22px;
				background: var(--background);
			}
			.dialog-overlay {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 18px;
				background: var(--overlay);
			}
			.dialog {
				width: min(330px, 100%);
				padding: 18px;
				border: 1px solid var(--border);
				border-radius: 22px;
				background: var(--card);
				color: var(--card-foreground);
				box-shadow: 0 18px 46px
					color-mix(in srgb, var(--overlay) 70%, transparent);
			}

			/* IDE preview: every custom IDE role is visible here. */
			.ide {
				position: relative;
				display: grid;
				grid-template-rows: 32px 1fr 22px;
				height: 700px;
				background: var(--ide-editor);
				color: var(--ide-foreground);
				font:
					12px/1.45 -apple-system,
					"Segoe UI",
					sans-serif;
			}
			.ide-titlebar {
				display: grid;
				grid-template-columns: 1fr minmax(220px, 380px) 1fr;
				align-items: center;
				gap: 8px;
				padding: 0 9px;
				border-bottom: 1px solid var(--ide-border);
				background: var(--ide-chrome);
			}
			.ide-menu {
				display: flex;
				gap: 2px;
			}
			.ide-menu span {
				padding: 3px 7px;
				border-radius: 4px;
			}
			.ide-menu .hovered {
				background: var(--ide-hover);
			}
			.command-center {
				height: 23px;
				padding: 2px 12px;
				border: 1px solid var(--ide-border);
				border-radius: 6px;
				background: var(--ide-surface);
				color: var(--ide-muted-foreground);
				text-align: center;
			}
			.window-actions {
				justify-self: end;
				color: var(--ide-muted-foreground);
			}
			.ide-main {
				display: grid;
				grid-template-columns: 48px 220px minmax(0, 1fr);
				min-height: 0;
			}
			.activity {
				border-right: 1px solid var(--ide-border);
				background: var(--ide-chrome);
			}
			.activity div {
				display: grid;
				height: 48px;
				place-items: center;
				border-left: 2px solid transparent;
				color: var(--ide-muted-foreground);
				font-size: 18px;
			}
			.activity .active {
				border-left-color: var(--ide-focus);
				color: var(--ide-foreground);
			}
			.ide-sidebar {
				display: grid;
				grid-template-rows: 34px 24px 1fr;
				min-height: 0;
				border-right: 1px solid var(--ide-border);
				background: var(--ide-chrome);
			}
			.sidebar-title {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 12px 0 18px;
				color: var(--ide-muted-foreground);
				font-size: 11px;
				letter-spacing: 0.05em;
				text-transform: uppercase;
			}
			.tree-section {
				padding: 4px 8px;
				font-size: 11px;
				font-weight: 700;
			}
			.tree-row {
				display: flex;
				height: 23px;
				align-items: center;
				gap: 6px;
				padding-right: 8px;
				white-space: nowrap;
			}
			.tree-row.selected,
			.tree-row:hover {
				background: var(--ide-hover);
			}
			.tree-row.selected {
				outline: 1px solid var(--ide-focus);
				outline-offset: -1px;
			}
			.tree-row.ignored {
				color: var(--ide-ignored);
			}
			.git {
				margin-left: auto;
				font-weight: 700;
			}
			.editor-column {
				display: grid;
				grid-template-rows: 35px 24px 1fr 190px;
				min-width: 0;
				background: var(--ide-editor);
			}
			.tabs {
				display: flex;
				background: var(--ide-surface);
			}
			.ide-tab {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 13px;
				border-right: 1px solid var(--ide-border);
				color: var(--ide-muted-foreground);
			}
			.ide-tab.active {
				background: var(--ide-editor);
				color: var(--ide-foreground);
				box-shadow: inset 0 1px var(--ide-focus);
			}
			.breadcrumbs {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 0 15px;
				color: var(--ide-muted-foreground);
			}
			.code-area {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 70px;
				min-height: 0;
				overflow: hidden;
				font:
					12.5px/20px "Cascadia Mono",
					Consolas,
					monospace;
			}
			.code-lines {
				padding: 8px 0;
			}
			.code-line {
				display: grid;
				grid-template-columns: 46px 10px 1fr;
				min-height: 20px;
				white-space: pre;
			}
			.code-line.current {
				background: var(--ide-hover);
			}
			.line-number {
				padding-right: 12px;
				color: var(--ide-line-number);
				text-align: right;
			}
			.gutter.added {
				background: var(--success);
			}
			.gutter.changed {
				background: var(--warning);
			}
			.kw {
				color: var(--ide-keyword);
			}
			.str {
				color: var(--ide-string);
			}
			.num {
				color: var(--ide-number);
			}
			.fn {
				color: var(--ide-function);
			}
			.typ {
				color: var(--ide-type);
			}
			.variable {
				color: var(--ide-variable);
			}
			.punctuation {
				color: var(--ide-punctuation);
			}
			.comment {
				color: var(--ide-comment);
			}
			.invalid-token {
				color: var(--destructive);
				text-decoration: wavy underline;
			}
			.minimap {
				padding: 12px 9px;
				border-left: 1px solid var(--ide-border);
			}
			.minimap i {
				display: block;
				height: 3px;
				margin-bottom: 3px;
				border-radius: 2px;
				opacity: 0.75;
			}
			.panel {
				display: grid;
				grid-template-rows: 32px 1fr;
				border-top: 1px solid var(--ide-border);
				background: var(--ide-chrome);
			}
			.panel-tabs {
				display: flex;
				align-items: center;
				gap: 18px;
				padding: 0 14px;
				color: var(--ide-muted-foreground);
			}
			.panel-tabs .active {
				height: 32px;
				padding-top: 8px;
				border-bottom: 1px solid var(--ide-focus);
				color: var(--ide-foreground);
			}
			.terminal {
				padding: 7px 14px;
				background: var(--ide-editor);
				font:
					12px/19px "Cascadia Mono",
					Consolas,
					monospace;
				white-space: pre;
			}
			.ansi-strip {
				display: flex;
				gap: 4px;
				margin-top: 5px;
			}
			.ansi-strip i {
				width: 25px;
				height: 11px;
				border: 1px solid var(--ide-border);
			}
			.ide-statusbar {
				display: flex;
				align-items: center;
				gap: 15px;
				padding: 0 8px;
				background: var(--ide-primary);
				color: var(--ide-primary-foreground);
			}
			.ide-statusbar .right {
				margin-left: auto;
			}
			.quick-input {
				position: absolute;
				top: 64px;
				left: 50%;
				width: min(460px, 55%);
				translate: -50% 0;
				overflow: hidden;
				border: 1px solid var(--ide-border);
				border-radius: 8px;
				background: var(--ide-surface);
				box-shadow: 0 14px 42px var(--ide-shadow);
			}
			.quick-input .field {
				margin: 8px;
				padding: 6px 9px;
				border: 1px solid var(--ide-focus);
				border-radius: 4px;
				background: var(--ide-editor);
			}
			.quick-row {
				display: flex;
				justify-content: space-between;
				padding: 6px 12px;
				color: var(--ide-muted-foreground);
			}
			.quick-row.selected {
				background: var(--ide-hover);
				color: var(--ide-foreground);
			}
			.notification {
				position: absolute;
				right: 14px;
				bottom: 36px;
				width: 320px;
				padding: 13px;
				border: 1px solid var(--ide-border);
				border-radius: 6px;
				background: var(--ide-surface);
				box-shadow: 0 10px 30px var(--ide-shadow);
			}
			.notification .actions {
				display: flex;
				justify-content: end;
				gap: 6px;
				margin-top: 10px;
			}

			@media (max-width: 950px) {
				.layout {
					display: block;
				}
				.controls {
					border-right: 0;
					border-bottom: 1px solid #303239;
				}
				.stage {
					overflow-x: auto;
				}
			}
		</style>
	</head>
	<body>
		<header class="toolbar">
			<h1>Theme</h1>
			<div class="segment" id="area" aria-label="Preview">
				<button data-value="web" aria-pressed="true">Website</button>
				<button data-value="ide" aria-pressed="false">IDE</button>
			</div>
			<div class="segment" id="scheme" aria-label="Scheme">
				<button data-value="light" aria-pressed="true">Light</button>
				<button data-value="dark" aria-pressed="false">Dark</button>
			</div>
			<button id="save">Save</button>
		</header>
		<main class="layout">
			<aside class="controls">
				<div id="roles"></div>
				<p id="status"></p>
			</aside>
			<section class="stage" id="stage"></section>
		</main>
		<script type="module">
			const theme = await fetch("/theme").then((response) => response.json());
			const roles = document.querySelector("#roles");
			const stage = document.querySelector("#stage");
			const status = document.querySelector("#status");
			let area = "web";
			let scheme = "light";

			const GROUPS = {
				web: [
					[
						"Surfaces",
						[
							["background", "Page"],
							["card", "Card"],
							["popover", "Popover"],
							["secondary", "Secondary"],
							["muted", "Muted"],
							["accent", "Accent"],
							["overlay", "Overlay"]
						]
					],
					[
						"Text and actions",
						[
							["foreground", "Page text"],
							["cardForeground", "Card text"],
							["popoverForeground", "Popover text"],
							["primary", "Primary"],
							["primaryForeground", "Primary text"],
							["secondaryForeground", "Secondary text"],
							["mutedForeground", "Muted text"],
							["accentForeground", "Accent text"]
						]
					],
					[
						"Status",
						[
							["success", "Success"],
							["warning", "Warning"],
							["destructive", "Destructive"],
							["info", "Info"]
						]
					],
					[
						"Structure",
						[
							["border", "Border"],
							["input", "Input"],
							["ring", "Focus ring"]
						]
					],

			function setPressed(container, selected) {
				for (const button of container.querySelectorAll("button"))
					button.setAttribute(
						"aria-pressed",
						String(button.dataset.value === selected)
					);
			}

			function normalize(value) {
				const text = value.trim().toLowerCase();
				const short = /^#([0-9a-f]{3}|[0-9a-f]{4})$/.exec(text);
				if (short)
					return (
						"#" +
						[...short[1]].map((character) => character + character).join("")
					);
				return /^#[0-9a-f]{6}([0-9a-f]{2})?$/.test(text) ? text : null;
			}

			function paint() {
				const preview = stage.querySelector(".preview");
				if (!preview) return;
				for (const [key, value] of Object.entries(theme.web[scheme]))
					preview.style.setProperty(
						`--${key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`,
						value
					);
				for (const [key, value] of Object.entries(theme.ide[scheme]))
					preview.style.setProperty(
						`--ide-${key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`,
						value
					);
			}

			function renderControls() {
				roles.replaceChildren();
				for (const [title, entries] of GROUPS[area]) {
					const group = document.createElement("section");
					group.className = "group";
					const heading = document.createElement("h2");
					heading.textContent = title;
					group.append(heading);
					for (const [key, label, source = area] of entries) {
						const row = document.createElement("label");
						row.className = "role";
						row.dataset.source = source;
						const name = document.createElement("span");
						name.className = "role-name";
						name.title = label;
						name.textContent = label;
						const color = document.createElement("input");
						color.type = "color";
						const text = document.createElement("input");
						text.type = "text";
						text.spellcheck = false;
						text.setAttribute("aria-label", `${label} hex color`);
						const current = () => theme[source][scheme][key];
						color.value = current().slice(0, 7);
						text.value = current();
						const update = (next) => {
							theme[source][scheme][key] = next;
							color.value = next.slice(0, 7);
							text.value = next;
							text.classList.remove("invalid");
							paint();
						};
						color.oninput = () => {
							const alpha = current().length === 9 ? current().slice(7) : "";
							update(color.value.toLowerCase() + alpha);
						};
						text.oninput = () => {
							const next = normalize(text.value);
							text.classList.toggle("invalid", !next);
							if (next) {
								theme[source][scheme][key] = next;
								color.value = next.slice(0, 7);
								paint();
							}
						};
						text.onchange = () => {
							const next = normalize(text.value);
							if (next) update(next);
							else text.value = current();
						};
						row.append(name, color, text);
						group.append(row);
					}
					roles.append(group);
				}
			}

			function render() {
				stage.innerHTML = area === "web" ? WEBSITE : IDE;
				renderControls();
				paint();
				setPressed(document.querySelector("#area"), area);
				setPressed(document.querySelector("#scheme"), scheme);
			}

			document.querySelector("#area").onclick = (event) => {
				const button = event.target.closest("button[data-value]");
				if (!button) return;
				area = button.dataset.value;
				render();
			};
			document.querySelector("#scheme").onclick = (event) => {
				const button = event.target.closest("button[data-value]");
				if (!button) return;
				scheme = button.dataset.value;
				render();
			};
			document.querySelector("#save").onclick = async () => {
				const save = document.querySelector("#save");
				save.disabled = true;
				status.className = "";
				status.textContent = "Saving…";
				const response = await fetch("/theme", {
					method: "PUT",
					headers: { "content-type": "application/json" },
					body: JSON.stringify(theme)
				});
				status.textContent = response.ok
					? "Saved and regenerated."
					: await response.text();
				status.className = response.ok ? "" : "error";
				save.disabled = false;
			};
			render();
		</script>
