<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Colors</title>
		<style>
			* {
				box-sizing: border-box;
			}
			:root {
				font:
					13px/1.45 Inter,
					ui-sans-serif,
					system-ui,
					sans-serif;
				background: var(--background);
				color: var(--foreground);
			}
			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				margin: 0;
			}
			button,
			input {
				font: inherit;
			}
			input[type="checkbox"] {
				width: 14px;
				height: 14px;
				accent-color: var(--foreground);
			}
			button {
				color: inherit;
			}
			.toolbar {
				flex-wrap: wrap;
				position: sticky;
				top: 0;
				z-index: 10;
				display: flex;
				min-height: 54px;
				align-items: center;
				gap: 16px;
				padding: 8px 14px;
				border-bottom: 1px solid var(--border);
				background: var(--muted);
			}
			h1 {
				margin: 0 auto 0 0;
				font-size: 16px;
				font-weight: 650;
			}
			.segment {
				display: flex;
				gap: 2px;
				padding: 3px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--background);
			}
			.segment button,
			.primary {
				min-height: 30px;
				padding: 5px 10px;
				border: 0;
				border-radius: 5px;
				background: transparent;
				cursor: pointer;
			}
			.history {
				display: flex;
				gap: 2px;
			}
			.history button {
				min-width: 30px;
				min-height: 30px;
				padding: 0;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
				font-size: 15px;
			}
			.history button:hover:not(:disabled) {
				background: var(--accent);
				color: var(--foreground);
			}
			.history button:disabled {
				cursor: default;
				opacity: 0.35;
			}
			.segment button[aria-pressed="true"] {
				background: var(--accent);
				color: var(--accent-foreground);
				box-shadow: 0 0 0 1px var(--border);
			}
			.primary {
				min-width: 64px;
				background: var(--primary);
				color: var(--primary-foreground);
				font-weight: 650;
			}
			.primary:disabled {
				cursor: default;
				opacity: 0.45;
			}
			.layout {
				display: grid;
				grid-template-columns: 420px minmax(640px, 1fr);
				flex: 1;
				min-height: 0;
			}
			.controls {
				overflow: auto;
				scrollbar-gutter: stable;
				padding: 16px 14px;
				border-right: 1px solid var(--border);
				background: var(--muted);
			}
			.group + .group {
				margin-top: 22px;
			}
			.group h2 {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				margin: 0 0 7px;
				color: var(--muted-foreground);
				font-size: 11px;
				font-weight: 650;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.role {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 26px 34px 94px 26px 22px;
				align-items: center;
				gap: 6px;
				min-height: 34px;
			}
			.role[hidden],
			.group[hidden] {
				display: none;
			}
			.area {
				border: 1px solid var(--border);
				border-radius: 8px;
				color: var(--muted-foreground);
				font-size: 9px;
				font-weight: 650;
				letter-spacing: 0.03em;
				text-align: center;
			}
			.link {
				width: 26px;
				height: 22px;
				padding: 0;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
				font-size: 11px;
			}
			.link:hover {
				background: var(--accent);
				color: var(--foreground);
			}
			.link.loose {
				color: var(--destructive);
			}
			.filter {
				display: flex;
				align-items: center;
				gap: 6px;
				color: var(--muted-foreground);
			}
			.plain {
				min-height: 30px;
				padding: 5px 10px;
				border: 1px solid var(--border);
				border-radius: 5px;
				background: transparent;
				cursor: pointer;
			}
			.plain:hover:not(:disabled) {
				background: var(--accent);
			}
			.plain:disabled {
				cursor: default;
				opacity: 0.45;
			}
			#transfer {
				width: min(680px, 90vw);
				padding: 16px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: var(--popover);
				color: var(--popover-foreground);
			}
			#transfer::backdrop {
				background: var(--overlay);
			}
			#transfer h2 {
				margin: 0 0 10px;
				font-size: 14px;
			}
			#transfer-text {
				width: 100%;
				height: 46vh;
				padding: 10px;
				border: 1px solid var(--input);
				border-radius: 6px;
				outline: none;
				background: var(--background);
				color: var(--foreground);
				font:
					12px/1.5 ui-monospace,
					"SFMono-Regular",
					Consolas,
					monospace;
				resize: vertical;
			}
			#transfer-status {
				min-height: 20px;
				margin: 8px 0 0;
				color: var(--muted-foreground);
			}
			#transfer-status.error {
				color: var(--destructive);
			}
			.transfer-actions {
				display: flex;
				justify-content: flex-end;
				gap: 8px;
				margin-top: 10px;
			}
			.role-name {
				overflow: hidden;
				color: var(--foreground);
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.swatch {
				width: 34px;
				height: 26px;
				padding: 0;
				border: 1px solid var(--border);
				border-radius: 5px;
				cursor: pointer;
			}
			.reset {
				width: 22px;
				height: 22px;
				padding: 0;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
				font-size: 14px;
			}
			.reset:hover:not(:disabled) {
				background: var(--accent);
				color: var(--foreground);
			}
			.reset:disabled {
				cursor: default;
				opacity: 0.35;
			}

			/* Hex-first picker: the native one opens in RGB and cannot be told otherwise. */
			#picker {
				position: fixed;
				inset: auto;
				width: 264px;
				margin: 0;
				padding: 12px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 14px 40px
					color-mix(in srgb, var(--overlay) 65%, transparent);
			}
			#picker .sv {
				position: relative;
				height: 176px;
				border-radius: 5px;
				cursor: crosshair;
				touch-action: none;
			}
			#picker .sv i {
				position: absolute;
				width: 16px;
				height: 16px;
				border: 2px solid #ffffff;
				border-radius: 50%;
				box-shadow: 0 0 0 1px #00000080;
				pointer-events: none;
				translate: -50% -50%;
			}
			#picker input[type="range"] {
				width: 100%;
				height: 18px;
				margin: 12px 0 0;
				appearance: none;
				border-radius: 9px;
			}
			#picker input[type="range"]::-webkit-slider-thumb {
				width: 18px;
				height: 18px;
				appearance: none;
				border: 3px solid #ffffff;
				border-radius: 50%;
				box-shadow: 0 0 0 1px #00000080;
			}
			#picker input[type="text"] {
				width: 100%;
				height: 32px;
				margin-top: 12px;
				font-size: 14px;
				text-align: center;
			}
			input[type="text"] {
				width: 94px;
				height: 27px;
				padding: 3px 6px;
				border: 1px solid var(--input);
				border-radius: 5px;
				outline: none;
				background: var(--background);
				color: var(--foreground);
				font:
					12px/1.2 ui-monospace,
					"SFMono-Regular",
					Consolas,
					monospace;
			}
			input[type="text"]:focus {
				border-color: var(--ring);
			}
			input[type="text"].invalid {
				border-color: var(--destructive);
				color: var(--destructive);
			}
			#status {
				min-height: 20px;
				margin: 16px 0 0;
				color: var(--muted-foreground);
			}
			#status.error {
				color: var(--destructive);
			}
			.stage {
				display: grid;
				min-width: 0;
				overflow: hidden;
				padding: 24px;
				background: var(--background);
			}
			.preview {
				min-height: 0;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 10px;
				box-shadow: 0 18px 55px
					color-mix(in srgb, var(--overlay) 45%, transparent);
			}

			/* Website preview: shapes mirror the real primitives without copying a page. */
			.site {
				display: flex;
				flex-direction: column;
				height: 100%;
				background: var(--background);
				color: var(--foreground);
				font-size: 14px;
			}
			.site-header {
				display: flex;
				height: 58px;
				align-items: center;
				gap: 8px;
				padding: 0 22px;
				border-bottom: 1px solid var(--border);
				background: var(--background);
			}
			.brand {
				margin-right: auto;
				font-size: 16px;
				font-weight: 700;
			}
			.site-button {
				display: inline-flex;
				height: 32px;
				align-items: center;
				justify-content: center;
				padding: 0 13px;
				border: 1px solid transparent;
				border-radius: 18px;
				font-weight: 600;
			}
			.site-button.primary {
				background: var(--primary);
				color: var(--primary-foreground);
			}
			.site-button.outline {
				border-color: var(--border);
				background: var(--background);
			}
			.site-button.secondary {
				background: var(--secondary);
				color: var(--secondary-foreground);
			}
			.site-button.destructive {
				background: color-mix(in srgb, var(--destructive) 12%, transparent);
				color: var(--destructive);
			}
			.site-button.ghost {
				background: color-mix(in srgb, var(--foreground) 6%, transparent);
			}
			.hero {
				padding: clamp(16px, 4vh, 42px) 32px clamp(14px, 3vh, 30px);
				text-align: center;
			}
			.eyebrow {
				color: var(--info);
				font-size: 12px;
				font-weight: 650;
			}
			.hero h2 {
				max-width: 720px;
				margin: 8px auto;
				font-size: 34px;
				line-height: 1.08;
				letter-spacing: -0.035em;
			}
			.hero p {
				max-width: 600px;
				margin: 0 auto 18px;
				color: var(--muted-foreground);
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 8px;
			}
			.hero .row {
				justify-content: center;
			}
			.site-content {
				display: grid;
				flex: 1;
				grid-template-columns: minmax(0, 1.6fr) minmax(260px, 0.8fr);
				gap: 18px;
				min-height: 0;
				padding: 0 24px 24px;
			}
			.site-card {
				display: flex;
				flex-direction: column;
				min-height: 0;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 22px;
				background: var(--card);
				color: var(--card-foreground);
			}
			.card-pad {
				padding: 20px;
			}
			.card-title {
				font-size: 16px;
				font-weight: 650;
			}
			.muted {
				color: var(--muted-foreground);
			}
			.status {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 12px;
				font-weight: 600;
			}
			.status::before {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: currentColor;
				content: "";
			}
			.success {
				color: var(--success);
			}
			.warning {
				color: var(--warning);
			}
			.destructive-text {
				color: var(--destructive);
			}
			.info {
				color: var(--info);
			}
			.metrics {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				margin: 18px 0;
			}
			.metric {
				padding: 12px;
				border-radius: 14px;
				background: var(--muted);
			}
			.metric b {
				display: block;
				margin-top: 3px;
				font-size: 18px;
			}
			.chart {
				display: flex;
				height: 54px;
				align-items: end;
				gap: 7px;
				margin: -4px 0 18px;
				padding: 8px 10px 0;
				border-bottom: 1px solid var(--border);
			}
			.chart i {
				flex: 1;
				min-width: 10px;
				border-radius: 3px 3px 0 0;
			}
			.site-input {
				height: 32px;
				flex: 1;
				min-width: 150px;
				padding: 0 12px;
				border: 1px solid var(--input);
				border-radius: 16px;
				background: var(--background);
				color: var(--foreground);
				box-shadow: 0 0 0 1px transparent;
			}
			.site-input.focused {
				border-color: var(--ring);
				box-shadow: 0 0 0 1px var(--ring);
			}
			.table {
				flex: 1;
				overflow: hidden;
				border-top: 1px solid var(--border);
			}
			.table-row {
				display: grid;
				grid-template-columns: minmax(130px, 1fr) 110px 100px;
				align-items: center;
				min-height: 48px;
				padding: 0 20px;
				border-bottom: 1px solid var(--border);
			}
			.table-row:last-child {
				border-bottom: 0;
			}
			.table-head {
				min-height: 38px;
				color: var(--muted-foreground);
				font-size: 12px;
			}
			.stack {
				display: grid;
				grid-template-rows: auto auto minmax(120px, 1fr);
				gap: 18px;
				min-height: 0;
			}
			.popover {
				padding: 8px;
				border: 1px solid var(--border);
				border-radius: 18px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 12px 32px
					color-mix(in srgb, var(--overlay) 55%, transparent);
			}
			.menu-item {
				padding: 8px 10px;
				border-radius: 12px;
			}
			.menu-item.selected {
				background: var(--accent);
				color: var(--accent-foreground);
			}
			.menu-separator {
				height: 1px;
				margin: 5px -2px;
				background: var(--border);
			}
			.toast {
				display: grid;
				grid-template-columns: 18px 1fr;
				gap: 9px;
				padding: 14px;
				border: 1px solid var(--border);
				border-radius: 14px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 10px 28px
					color-mix(in srgb, var(--overlay) 45%, transparent);
			}
			.dialog-demo {
				position: relative;
				min-height: 0;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 22px;
				background: var(--background);
			}
			.dialog-overlay {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 18px;
				background: var(--overlay);
			}
			.dialog {
				width: min(330px, 100%);
				padding: 18px;
				border: 1px solid var(--border);
				border-radius: 22px;
				background: var(--card);
				color: var(--card-foreground);
				box-shadow: 0 18px 46px
					color-mix(in srgb, var(--overlay) 70%, transparent);
			}

			/* IDE preview: every custom IDE role is visible here. */
			.ide {
				position: relative;
				display: grid;
				grid-template-rows: 32px 1fr 22px;
				height: 100%;
				background: var(--ide-editor);
				color: var(--ide-foreground);
				font:
					12px/1.45 -apple-system,
					"Segoe UI",
					sans-serif;
			}
			.ide-titlebar {
				display: grid;
				grid-template-columns: 1fr minmax(220px, 380px) 1fr;
				align-items: center;
				gap: 8px;
				padding: 0 9px;
				border-bottom: 1px solid var(--ide-border);
				background: var(--ide-title-bar);
			}
			.ide-menu {
				display: flex;
				gap: 2px;
			}
			.ide-menu span {
				padding: 3px 7px;
				border-radius: 4px;
			}
			.ide-menu .hovered {
				background: var(--ide-hover);
			}
			.command-center {
				height: 23px;
				padding: 2px 12px;
				border: 1px solid var(--ide-input-border);
				border-radius: 6px;
				background: var(--ide-widget);
				color: var(--ide-placeholder);
				text-align: center;
			}
			.window-actions {
				justify-self: end;
				color: var(--ide-title-bar-foreground);
			}
			.ide-main {
				display: grid;
				grid-template-columns: 48px 220px minmax(0, 1fr);
				min-height: 0;
			}
			.activity {
				border-right: 1px solid var(--ide-border);
				background: var(--ide-activity-bar);
			}
			.activity div {
				display: grid;
				height: 48px;
				place-items: center;
				border-left: 2px solid transparent;
				color: var(--ide-activity-bar-inactive);
				font-size: 18px;
			}
			.activity .active {
				border-left-color: var(--ide-focus);
				color: var(--ide-foreground);
			}
			.ide-sidebar {
				display: grid;
				grid-template-rows: 34px 24px 1fr;
				min-height: 0;
				border-right: 1px solid var(--ide-border);
				background: var(--ide-side-bar);
			}
			.sidebar-title {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 12px 0 18px;
				color: var(--ide-muted-foreground);
				font-size: 11px;
				letter-spacing: 0.05em;
				text-transform: uppercase;
			}
			.tree-section {
				padding: 4px 8px;
				font-size: 11px;
				font-weight: 700;
			}
			.tree-row {
				display: flex;
				height: 23px;
				align-items: center;
				gap: 6px;
				padding-right: 8px;
				white-space: nowrap;
			}
			.tree-row.selected,
			.tree-row:hover {
				background: var(--ide-hover);
			}
			.tree-row.selected {
				outline: 1px solid var(--ide-focus);
				outline-offset: -1px;
			}
			.tree-row.ignored {
				color: var(--ide-ignored);
			}
			.git {
				margin-left: auto;
				font-weight: 700;
			}
			.editor-column {
				display: grid;
				grid-template-rows: 35px 24px 1fr 190px;
				min-width: 0;
				background: var(--ide-editor);
			}
			.tabs {
				display: flex;
				background: var(--ide-tab-bar);
			}
			.ide-tab {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 13px;
				border-right: 1px solid var(--ide-tab-border);
				background: var(--ide-tab-inactive);
				color: var(--ide-tab-inactive-foreground);
			}
			.ide-tab.active {
				background: var(--ide-tab-active);
				color: var(--ide-tab-active-foreground);
				box-shadow: inset 0 1px var(--ide-focus);
			}
			.breadcrumbs {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 0 15px;
				background: var(--ide-breadcrumb);
				color: var(--ide-breadcrumb-foreground);
			}
			.code-area {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 70px;
				min-height: 0;
				overflow: hidden;
				font:
					12.5px/20px "Cascadia Mono",
					Consolas,
					monospace;
			}
			.code-lines {
				padding: 8px 0;
			}
			.code-line {
				display: grid;
				grid-template-columns: 46px 10px 1fr;
				min-height: 20px;
				white-space: pre;
			}
			.code-line.current {
				background: var(--ide-hover);
			}
			.line-number {
				padding-right: 12px;
				color: var(--ide-line-number);
				text-align: right;
			}
			.gutter.added {
				background: var(--success);
			}
			.gutter.changed {
				background: var(--warning);
			}
			.kw {
				color: var(--ide-keyword);
			}
			.str {
				color: var(--ide-string);
			}
			.num {
				color: var(--ide-number);
			}
			.fn {

									<div class="code-line"><span class="line-number">4</span><i></i><span><b class="guide"></b><span class="kw">const</span> <span class="variable">schemes</span> <span class="op">=</span> <span class="punctuation">[</span><span class="str">"light"</span><span class="punctuation">,</span> <span class="str">"dark"</span><span class="punctuation">];</span></span></div>
									<div class="code-line"><span class="line-number">5</span><i class="gutter added"></i><span><b class="guide"></b><span class="kw">for</span> <span class="punctuation">(</span><span class="kw">const</span> <span class="variable">scheme</span> <span class="op">of</span> <span class="variable">schemes</span><span class="punctuation">) {</span></span></div>
									<div class="code-line current"><span class="line-number">6</span><i></i><span><b class="guide"></b><b class="guide"></b><span class="fn">paint</span><span class="punctuation">(</span><span class="variable">theme</span><span class="punctuation">.</span><span class="prop">colors</span><span class="punctuation">,</span> <span class="num">0.85</span><span class="punctuation">);</span><b class="caret"></b></span></div>
									<div class="code-line"><span class="line-number">7</span><i></i><span><b class="guide"></b><span class="punctuation">}</span></span></div>
									<div class="code-line"><span class="line-number">8</span><i></i><span><span class="punctuation">}</span></span></div>
									<div class="code-line"><span class="line-number">9</span><i></i><span></span></div>
									<div class="code-line"><span class="line-number">10</span><i></i><span><span class="comment">// Diagnostics and diffs share </span><span class="selected-code"><span class="comment">product status roles</span></span><span class="comment">.</span></span></div>
									<div class="code-line"><span class="line-number">11</span><i></i><span><span class="punctuation">&lt;</span><span class="tag">section</span> <span class="prop">class</span><span class="op">=</span><span class="found"><span class="str">"stage"</span></span><span class="punctuation">&gt;</span><span class="invalid-token">missingTheme</span><span class="punctuation">&lt;/</span><span class="tag">section</span><span class="punctuation">&gt;</span></span></div>
								</div>
								<div class="minimap"><b class="slider"></b><i class="kw" style="background:currentColor;width:85%"></i><i class="typ" style="background:currentColor;width:55%"></i><i class="str" style="background:currentColor;width:75%"></i><i class="fn" style="background:currentColor;width:60%"></i><i class="num" style="background:currentColor;width:38%"></i><i class="comment" style="background:currentColor;width:90%"></i></div>
							</div>
							<div class="panel">
								<div class="panel-tabs"><span>Problems</span><span>Output</span><span class="active">Terminal</span><span>Ports</span></div>
								<div class="terminal"><span class="str">user@box</span><span class="punctuation">:</span><span class="typ">~/composery</span><span class="punctuation">$</span> pnpm check
<span class="success">✓</span> 1,215 tests passed
<span class="warning">⚠</span> 2 files modified
<span class="destructive-text">✗</span> one invalid token
<span class="info">ℹ</span> editor theme regenerated
<span class="ansi-strip"><i style="background:var(--ide-ansi-black)"></i><i style="background:var(--destructive)"></i><i style="background:var(--success)"></i><i style="background:var(--warning)"></i><i style="background:var(--info)"></i><i style="background:var(--ide-ansi-magenta)"></i><i style="background:var(--ide-ansi-cyan)"></i><i style="background:var(--ide-ansi-white)"></i></span><span class="ansi-strip"><i style="background:var(--ide-ansi-bright-black)"></i><i style="background:var(--ide-ansi-bright-red)"></i><i style="background:var(--ide-ansi-bright-green)"></i><i style="background:var(--ide-ansi-bright-yellow)"></i><i style="background:var(--ide-ansi-bright-blue)"></i><i style="background:var(--ide-ansi-bright-magenta)"></i><i style="background:var(--ide-ansi-bright-cyan)"></i><i style="background:var(--ide-ansi-bright-white)"></i></span></div>
							</div>
						</div>
					</div>
					<div class="ide-statusbar"><span>⑂ main*</span><span>↻ 0↓ 2↑</span><span>✕ 1</span><span class="right">Ln 3, Col 18　UTF-8　TypeScript</span></div>
					<div class="quick-input">
						<div class="field">&gt; theme</div>
						<div class="quick-row selected"><span>Preferences: Color Theme</span><span>Ctrl+K Ctrl+T</span></div>
						<div class="quick-row"><span>Inspect Editor Tokens and Scopes</span></div>
						<div class="quick-row"><span>Open Settings (JSON)</span><span>Ctrl+,</span></div>
					</div>
					<div class="notification">
						<div><span class="info">ⓘ</span> A new Composery build is available. <span class="ide-link">Release notes</span></div>
						<div class="actions"><span class="site-button outline">Later</span><span class="site-button primary">Reload</span></div>
					</div>
				</div>`;

			function setPressed(container, selected) {
				for (const button of container.querySelectorAll("button"))
					button.setAttribute(
						"aria-pressed",
						String(button.dataset.value === selected)
					);
			}

			// Pasted colours arrive with quotes, semicolons, 0x, or no hash at all.
			function normalize(value) {
				const digits = value
					.trim()
					.toLowerCase()
					.replace(/[\s"'`;,]/g, "")
					.replace(/^(?:#|0x)+/, "");
				if (!/^[0-9a-f]+$/.test(digits)) return null;
				if (digits.length === 3 || digits.length === 4)
					return `#${[...digits].map((character) => character + character).join("")}`;
				return digits.length === 6 || digits.length === 8 ? `#${digits}` : null;
			}

			function toHsv(hex) {
				const [red, green, blue] = [1, 3, 5].map(
					(index) => parseInt(hex.slice(index, index + 2), 16) / 255
				);
				const value = Math.max(red, green, blue);
				const span = value - Math.min(red, green, blue);
				const hue =
					span === 0
						? 0
						: value === red
							? (green - blue) / span + (green < blue ? 6 : 0)
							: value === green
								? (blue - red) / span + 2
								: (red - green) / span + 4;
				return [hue * 60, value === 0 ? 0 : span / value, value];
			}

			function toHex([hue, saturation, value]) {
				const channel = (offset) => {
					const k = (offset + hue / 60) % 6;
					const c =
						value * (1 - saturation * Math.max(0, Math.min(k, 4 - k, 1)));
					return Math.round(c * 255)
						.toString(16)
						.padStart(2, "0");
				};
				return `#${channel(5)}${channel(3)}${channel(1)}`;
			}

			const picker = document.querySelector("#picker");
			const sv = picker.querySelector(".sv");
			const knob = picker.querySelector(".sv i");
			const hue = picker.querySelector(".hue");
			const alpha = picker.querySelector(".alpha");
			const hexField = picker.querySelector(".hex");
			let hsv = [0, 0, 0];
			let emit = () => {};

			// The hue rail comes from the same conversion the picker writes with.
			hue.style.background = `linear-gradient(to right, ${[
				0, 60, 120, 180, 240, 300, 360
			]
				.map((degrees) => toHex([degrees, 1, 1]))
				.join(", ")})`;

			function refreshPicker() {
				const base = toHex([hsv[0], 1, 1]);
				const hex = toHex(hsv);
				sv.style.background = `linear-gradient(to top, #000, #0000), linear-gradient(to right, #fff, #fff0), ${base}`;
				knob.style.left = `${hsv[1] * 100}%`;
				knob.style.top = `${(1 - hsv[2]) * 100}%`;
				knob.style.background = hex;
				alpha.style.background = `linear-gradient(to right, ${hex}00, ${hex}), repeating-conic-gradient(#737373 0 25%, #262626 0 50%) 0 0/12px 12px`;
			}

			function emitPicker() {
				const suffix =
					Number(alpha.value) === 255
						? ""
						: Number(alpha.value).toString(16).padStart(2, "0");
				const next = toHex(hsv) + suffix;
				hexField.value = next;
				refreshPicker();
				emit(next);
			}

			function openPicker(anchor, current, onChange) {
				hsv = toHsv(current);
				hue.value = String(Math.round(hsv[0]));
				alpha.value = String(
					current.length === 9 ? parseInt(current.slice(7), 16) : 255
				);
				hexField.value = current;
				emit = onChange;
				refreshPicker();
				picker.showPopover();
				const box = anchor.getBoundingClientRect();
				picker.style.left = `${Math.min(box.left, innerWidth - 280)}px`;
				picker.style.top = `${Math.min(box.bottom + 6, innerHeight - 300)}px`;
			}

			sv.onpointerdown = (event) => {
				sv.setPointerCapture(event.pointerId);
				const track = ({ clientX, clientY }) => {
					const box = sv.getBoundingClientRect();
					const clamp = (value) => Math.min(1, Math.max(0, value));
					hsv = [
						hsv[0],
						clamp((clientX - box.left) / box.width),
						1 - clamp((clientY - box.top) / box.height)
					];
					emitPicker();
				};
				sv.onpointermove = track;
				track(event);
			};
			sv.onpointerup = () => (sv.onpointermove = null);
			// The picker is anchored on open, so scrolling it out from under is a dismissal.
			roles.parentElement.onscroll = () => picker.hidePopover();
			picker.addEventListener("toggle", (event) => {
				if (event.newState === "closed") settle();
			});
			hue.oninput = () => {
				hsv = [Number(hue.value), hsv[1], hsv[2]];
				emitPicker();
			};
			alpha.oninput = emitPicker;
			hexField.oninput = () => {
				const next = normalize(hexField.value);
				hexField.classList.toggle("invalid", !next);
				if (!next) return;
				hsv = toHsv(next);
				hue.value = String(Math.round(hsv[0]));
				alpha.value = String(
					next.length === 9 ? parseInt(next.slice(7), 16) : 255
				);
				refreshPicker();
				emit(next);
			};

			// Roles holding the same value in this scheme move together, unless the
			// user has detached one to give it a life of its own.
			function linkedRoles(source, key) {
				if (detached.has(`${source}.${key}`)) return [[source, key]];
				const value = theme[source][scheme][key];
				const found = [];
				for (const area of ["web", "ide"])
					for (const [name, current] of Object.entries(theme[area][scheme]))
						if (current === value && !detached.has(`${area}.${name}`))
							found.push([area, name]);
				return found;
			}

			// Painted on the root, so the editor wears the scheme it is editing.
			function paint() {
				const root = document.documentElement;
				root.style.colorScheme = scheme;
				painted = {};
				for (const [prefix, values] of [
					["-", theme.web[scheme]],
					["-ide-", theme.ide[scheme]]
				])
					for (const [key, value] of Object.entries(values))
						painted[
							`-${prefix}${key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`
						] = value;
				for (const [name, value] of Object.entries(painted))
					root.style.setProperty(name, value);
				seen.clear();
				for (const section of sections) section.visible = 0;

				for (const refresh of rows) refresh();
				for (const section of sections)
					section.group.hidden = section.visible === 0;
				remember();
				undoButton.disabled = history.length === 0;
				redoButton.disabled = future.length === 0;
				undoButton.title = history.length
					? `Undo ${history.at(-1).label} (Ctrl+Z)`
					: "Nothing to undo";
				redoButton.title = future.length
					? `Redo ${future.at(-1).label} (Ctrl+Y)`
					: "Nothing to redo";
				resetAllButton.disabled =
					JSON.stringify(theme) === JSON.stringify(saved);
			}

			function renderControls() {
				roles.replaceChildren();
				rows.length = 0;
				sections.length = 0;
				for (const [title, entries] of GROUPS) {
					const group = document.createElement("section");
					group.className = "group";
					const heading = document.createElement("h2");
					heading.textContent = title;
					group.append(heading);
					const tally = { group, visible: 0 };
					sections.push(tally);
					for (const [source, key, label] of entries) {
						labels.set(`${source}.${key}`, label);
						const row = document.createElement("div");
						row.className = "role";
						const name = document.createElement("span");
						name.className = "role-name";
						name.title = label;
						name.textContent = label;
						const tag = document.createElement("b");
						tag.className = "area";
						tag.textContent = source;
						const swatch = document.createElement("button");
						swatch.type = "button";
						swatch.className = "swatch";
						swatch.setAttribute("aria-label", `${label} color picker`);
						const text = document.createElement("input");
						text.type = "text";
						text.spellcheck = false;
						text.setAttribute("aria-label", `${label} hex color`);
						const link = document.createElement("button");
						link.type = "button";
						link.className = "link";
						const reset = document.createElement("button");
						reset.type = "button";
						reset.className = "reset";
						reset.textContent = "↺";
						reset.title = "Reset this colour and everything linked to it";
						const id = `${source}.${key}`;
						const current = () => theme[source][scheme][key];
						const refresh = () => {
							const value = current();
							swatch.style.background = `linear-gradient(${value}, ${value}), repeating-conic-gradient(#737373 0 25%, #262626 0 50%) 0 0/8px 8px`;
							if (document.activeElement !== text) {
								text.value = value;
								text.classList.remove("invalid");
							}
							const loose = detached.has(id);
							const shared = linkedRoles(source, key);
							link.textContent = loose
								? "⊘"
								: shared.length > 1
									? String(shared.length)
									: "·";
							link.classList.toggle("loose", loose);
							link.title = loose
								? "Detached - edits here move nothing else. Click to link it back up."
								: shared.length > 1
									? `Linked with ${shared
											.filter((role) => `${role[0]}.${role[1]}` !== id)
											.map((role) => labels.get(role.join(".")))
											.join(", ")}. Click to detach this one.`
									: "Nothing else holds this value. Click to keep it that way.";
							reset.disabled = shared.every(
								([peerSource, peerKey]) =>
									theme[peerSource][scheme][peerKey] ===
									saved[peerSource][scheme][peerKey]
							);
							// "Hide linked" keeps the first row of each group of equal values,
							// counted over the rows the surface filter is letting through.
							const elsewhere = onlyArea && source !== area;
							let first = false;
							if (!elsewhere) {
								first = loose || !seen.has(value);
								if (!loose) seen.add(value);
							}
							row.hidden = elsewhere || (hideLinked && !first);
							if (!row.hidden) tally.visible += 1;
						};
						rows.push(refresh);
						// An edit that changes nothing must not land in the history.
						const update = (next) => {
							if (
								editing.every(
									([peerSource, peerKey]) =>
										theme[peerSource][scheme][peerKey] === next
								)
							)
								return;
							commitOnce();
							for (const [peerSource, peerKey] of editing)
								theme[peerSource][scheme][peerKey] = next;
							paint();
						};
						const startOn = (peers) => {
							settle();
							editing = peers;
							startEdit(
								peers.length > 1
									? `${label} and ${peers.length - 1} linked`
									: label
							);
						};
						swatch.onclick = () => {
							startOn(linkedRoles(source, key));
							openPicker(swatch, current(), update);
						};
						text.onfocus = () => startOn(linkedRoles(source, key));
						text.onblur = settle;
						link.onclick = () => {
							if (detached.has(id)) detached.delete(id);
							else detached.add(id);
							remember();
							paint();
						};
						reset.onclick = () => {
							const peers = linkedRoles(source, key);
							if (
								peers.every(
									([peerSource, peerKey]) =>
										theme[peerSource][scheme][peerKey] ===
										saved[peerSource][scheme][peerKey]
								)
							)
								return;
							settle();
							startEdit(`reset ${label}`);
							commitOnce();
							for (const [peerSource, peerKey] of peers)
								theme[peerSource][scheme][peerKey] =
									saved[peerSource][scheme][peerKey];
							paint();
						};
						text.oninput = () => {
							const next = normalize(text.value);
							text.classList.toggle("invalid", !next);
							if (next) update(next);
						};
						text.onchange = () => {
							const next = normalize(text.value);
							text.value = next ?? current();
							text.classList.remove("invalid");
						};
						row.append(name, tag, swatch, text, link, reset);
						group.append(row);
					}
					roles.append(group);
				}
			}

			function render() {
				picker.hidePopover();
				stage.innerHTML = area === "web" ? WEBSITE : IDE;
				paint();
				setPressed(document.querySelector("#area"), area);
				setPressed(document.querySelector("#scheme"), scheme);
			}

			document.querySelector("#area").onclick = (event) => {
				const button = event.target.closest("button[data-value]");
				if (!button) return;
				area = button.dataset.value;
				remember();
				render();
			};
			document.querySelector("#scheme").onclick = (event) => {
				const button = event.target.closest("button[data-value]");
				if (!button) return;
				scheme = button.dataset.value;
				remember();
				render();
			};
			document.querySelector("#save").onclick = async () => {
				const save = document.querySelector("#save");
				save.disabled = true;
				status.className = "";
				status.textContent = "Saving…";
				const response = await fetch("/theme", {
					method: "PUT",
					headers: { "content-type": "application/json" },
					body: JSON.stringify(theme)
				});
				if (response.ok) saved = structuredClone(theme);
				status.textContent = response.ok
					? "Saved and regenerated."
					: await response.text();
				status.className = response.ok ? "" : "error";
				save.disabled = false;
				paint();
			};
			const hideLinkedBox = document.querySelector("#hide-linked");
			const onlyAreaBox = document.querySelector("#only-area");
			hideLinkedBox.checked = hideLinked;
			onlyAreaBox.checked = onlyArea;
			hideLinkedBox.onchange = (event) => {
				hideLinked = event.target.checked;
				remember();
				paint();
			};
			onlyAreaBox.onchange = (event) => {
				onlyArea = event.target.checked;
				remember();
				paint();
			};

			resetAllButton.onclick = () => {
				if (JSON.stringify(theme) === JSON.stringify(saved)) return;
				settle();
				startEdit("reset all");
				commitOnce();
				apply(saved);
				paint();
			};

			// The transfer text is exactly what a save writes to theme.json.
			const transfer = document.querySelector("#transfer");
			const transferText = document.querySelector("#transfer-text");
			const transferStatus = document.querySelector("#transfer-status");
			const say = (message, bad) => {
				transferStatus.textContent = message;
				transferStatus.className = bad ? "error" : "";
			};

			function readTransfer(text) {
				const next = JSON.parse(text);
				const clean = { web: {}, ide: {} };
				for (const source of ["web", "ide"])
					for (const values of ["light", "dark"]) {
						const from = next?.[source]?.[values];
						const keys = Object.keys(theme[source][values]);
						if (!from || Object.keys(from).length !== keys.length)
							throw new Error(`${source}.${values} does not list every role`);
						clean[source][values] = {};
						for (const key of keys) {
							const value = normalize(String(from[key] ?? ""));
							if (!value)
								throw new Error(`${source}.${values}.${key} is not a colour`);
							clean[source][values][key] = value;
						}
					}
				return clean;
			}

			const applyButton = document.querySelector("#transfer-apply");

			// Apply stays off until the text is both readable and different.
			function reviewTransfer() {
				let next;
				try {
					next = readTransfer(transferText.value);
				} catch (error) {
					applyButton.disabled = true;
					say(String(error?.message ?? error), true);
					return null;
				}
				const same = JSON.stringify(next) === JSON.stringify(theme);
				applyButton.disabled = same;
				say(
					same
						? "Unchanged - select all to copy it out, or paste a set over it."
						: "Ready to apply."
				);
				return same ? null : next;
			}

			document.querySelector("#transfer-open").onclick = () => {
				transferText.value = `${JSON.stringify(theme, null, "\t")}\n`;
				reviewTransfer();
				transfer.showModal();
				transferText.select();
			};
			document.querySelector("#transfer-close").onclick = () =>
				transfer.close();
			transferText.oninput = reviewTransfer;
			applyButton.onclick = () => {
				const next = reviewTransfer();
				if (!next) return;
				settle();
				startEdit("import");
				commitOnce();
				apply(next);
				paint();
				transfer.close();
			};
			renderControls();
			render();
		</script>
