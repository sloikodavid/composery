<div class="auth-fields password-flow" data-password-flow>
	<label class="sr-only" for="current-password">Current password</label>
	<div class="monaco-inputbox idle">
		<div class="ibwrapper">
			<input
				class="input empty"
				id="current-password"
				name="currentPassword"
				type="password"
				placeholder="Current password"
				autocomplete="current-password"
				autocorrect="off"
				autocapitalize="off"
				spellcheck="false"
				autofocus
				required
			/>
		</div>
	</div>
	<label class="sr-only" for="new-password">New password</label>
	<div class="monaco-inputbox idle">
		<div class="ibwrapper">
			<input
				class="input empty"
				id="new-password"
				name="newPassword"
				type="password"
				placeholder="New password"
				autocomplete="new-password"
				autocorrect="off"
				autocapitalize="off"
				spellcheck="false"
				data-password-input
				required
			/>
		</div>
	</div>
	<div class="password-status" data-password-status aria-live="polite"></div>
	<label class="sr-only" for="confirm-password">Confirm new password</label>
	<div class="monaco-inputbox idle">
		<div class="ibwrapper">
			<input
				class="input empty"
				id="confirm-password"
				name="confirmPassword"
				type="password"
				placeholder="Confirm new password"
				autocomplete="new-password"
				autocorrect="off"
				autocapitalize="off"
				spellcheck="false"
				data-password-confirm
				required
			/>
		</div>
	</div>
	<div class="password-status" data-confirm-status aria-live="polite"></div>
</div>
<button
	class="submit-button"
	data-password-submit
	data-submit-label="Change Password"
	type="submit"
>
	<span>Change Password</span>
</button>
