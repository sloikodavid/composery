<div class="auth-fields password-flow" data-password-flow>
	<label class="sr-only" for="password">Password</label>
	<div class="monaco-inputbox idle">
		<div class="ibwrapper">
			<input
				class="input empty"
				id="password"
				name="password"
				type="password"
				placeholder="Password"
				autocomplete="new-password"
				autocorrect="off"
				autocapitalize="off"
				spellcheck="false"
				data-password-input
				autofocus
				required
			/>
		</div>
	</div>
	<div class="password-status" data-password-status aria-live="polite"></div>
	<label class="sr-only" for="confirm-password">Confirm password</label>
	<div class="monaco-inputbox idle">
		<div class="ibwrapper">
			<input
				class="input empty"
				id="confirm-password"
				name="confirmPassword"
				type="password"
				placeholder="Confirm password"
				autocomplete="new-password"
				autocorrect="off"
				autocapitalize="off"
				spellcheck="false"
				data-password-confirm
				required
			/>
		</div>
	</div>
	<div class="password-status" data-confirm-status aria-live="polite"></div>
</div>
<button
	class="submit-button"
	data-password-submit
	data-submit-label="Set Password"
	type="submit"
>
	<span>Set Password</span>
</button>
