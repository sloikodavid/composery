<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta
			http-equiv="Content-Security-Policy"
			content="style-src 'self'; script-src 'self'; connect-src 'self' https://api.pwnedpasswords.com; manifest-src 'self'; img-src 'self' data:; font-src 'self' data:;"
		/>
		<meta name="color-scheme" content="light dark" />
		<title>{{TITLE}}</title>
		<!-- ICO first with explicit sizes, adaptive SVG last with sizes="any":
		     Chromium picks an unsized or later-listed ICO over the SVG and the
		     tab icon stops following the colour scheme. -->
		<link rel="icon" href="{{COMPOSERY_STATIC_BASE}}/src/browser/media/favicon.ico" type="image/x-icon" sizes="32x32" />
		<link rel="icon" href="{{COMPOSERY_STATIC_BASE}}/src/browser/media/favicon.svg" type="image/svg+xml" sizes="any" />
		<link rel="manifest" href="{{BASE}}/manifest.json" crossorigin="use-credentials" />
		<link href="{{COMPOSERY_STATIC_BASE}}/src/browser/pages/global.css" rel="stylesheet" />
		<link href="{{COMPOSERY_STATIC_BASE}}/src/browser/pages/auth.css" rel="stylesheet" />
		<meta id="composery-options" data-settings="{{OPTIONS}}" />
	</head>
	<body>
		<main class="page">
			<form class="auth-form" method="post" autocomplete="on" aria-label="{{FORM_LABEL}}">
				<a
					class="auth-logo-link"
					href="https://www.composery.io"
					target="_blank"
					rel="noopener"
					aria-label="Composery"
				>
					<img
						class="auth-logo"
						src="{{COMPOSERY_STATIC_BASE}}/src/browser/media/composery-logo.svg"
						alt="Composery"
					/>
				</a>
				<input
					class="username"
					name="username"
					type="text"
					autocomplete="username"
					value="user"
					readonly
					tabindex="-1"
					aria-hidden="true"
				/>
				<input id="base" type="hidden" name="base" value="{{BASE}}" />
				<input id="href" type="hidden" name="href" value="" />
				{{FIELDS}}
			</form>
		</main>
		{{PASSWORD_CHECK_SCRIPT}}
		<script src="{{COMPOSERY_STATIC_BASE}}/src/browser/pages/auth.js"></script>
	</body>
</html>
