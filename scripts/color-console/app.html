<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Composery colours</title>
		<style>
			/* The console chrome is deliberately neutral and fixed: it must not tint
			   the previews it is judging, so nothing in this block reads a palette
			   value. Everything below `preview scaffolding` is the opposite - it
			   mirrors the product's real components, token for token. */
			:root {
				--ui-bg: #16171a;
				--ui-panel: #1c1e22;
				--ui-raised: #23262b;
				--ui-line: #32363d;
				--ui-fg: #e6e8eb;
				--ui-dim: #9aa1ab;
				--ui-accent: #6ea8fe;
				--ui-warn: #f0b072;
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--ui-bg);
				color: var(--ui-fg);
				font:
					13px/1.45 ui-sans-serif,
					-apple-system,
					"Segoe UI",
					system-ui,
					sans-serif;
				height: 100vh;
				display: grid;
				grid-template-rows: auto 1fr;
				overflow: hidden;
			}
			button {
				font: inherit;
				color: inherit;
				background: none;
				border: 0;
				cursor: pointer;
			}
			input {
				font: inherit;
			}

			header.bar {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 10px 14px;
				border-bottom: 1px solid var(--ui-line);
				background: var(--ui-panel);
			}
			.brand {
				font-weight: 600;
				letter-spacing: -0.01em;
				margin-right: 4px;
			}
			.seg {
				display: flex;
				border: 1px solid var(--ui-line);
				border-radius: 8px;
				overflow: hidden;
			}
			.seg button {
				padding: 5px 12px;
				color: var(--ui-dim);
			}
			.seg button[aria-pressed="true"] {
				background: var(--ui-raised);
				color: var(--ui-fg);
			}
			.btn {
				padding: 5px 11px;
				border: 1px solid var(--ui-line);
				border-radius: 8px;
				background: var(--ui-raised);
			}
			.btn:disabled {
				opacity: 0.4;
				cursor: default;
			}
			.btn.primary {
				background: var(--ui-accent);
				border-color: var(--ui-accent);
				color: #0b1220;
				font-weight: 600;
			}
			.spacer {
				flex: 1;
			}
			.status {
				color: var(--ui-dim);
				font-size: 12px;
				min-width: 12ch;
			}
			.status.err {
				color: #ff8f8f;
			}
			.dirty-dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--ui-warn);
				display: inline-block;
				margin-right: 6px;
				visibility: hidden;
			}
			body.dirty .dirty-dot {
				visibility: visible;
			}

			main {
				display: grid;
				grid-template-columns: 348px 1fr;
				min-height: 0;
			}
			.controls {
				border-right: 1px solid var(--ui-line);
				overflow-y: auto;
				background: var(--ui-panel);
			}
			.preview-pane {
				display: grid;
				grid-template-rows: auto 1fr;
				min-width: 0;
				min-height: 0;
			}
			.tabs {
				display: flex;
				gap: 2px;
				padding: 8px 12px 0;
				border-bottom: 1px solid var(--ui-line);
			}
			.tabs button {
				padding: 6px 13px;
				border-radius: 8px 8px 0 0;
				color: var(--ui-dim);
				border: 1px solid transparent;
				border-bottom: 0;
			}
			.tabs button[aria-pressed="true"] {
				background: var(--ui-bg);
				border-color: var(--ui-line);
				color: var(--ui-fg);
			}
			.stage {
				overflow: auto;
				padding: 18px;
			}

			details.group {
				border-bottom: 1px solid var(--ui-line);
			}
			details.group > summary {
				padding: 9px 12px;
				cursor: pointer;
				font-weight: 600;
				font-size: 12px;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--ui-dim);
				display: flex;
				align-items: center;
				gap: 8px;
			}
			details.group > summary::-webkit-details-marker {
				display: none;
			}
			details.group > summary::before {
				content: "›";
				transition: transform 120ms;
				display: inline-block;
			}
			details.group[open] > summary::before {
				transform: rotate(90deg);
			}
			.group-note {
				padding: 0 12px 8px 26px;
				color: var(--ui-dim);
				font-size: 11.5px;
			}
			.row {
				display: grid;
				grid-template-columns: 1fr auto;
				gap: 6px;
				align-items: center;
				padding: 3px 12px 3px 26px;
			}
			.row:hover {
				background: #ffffff08;
			}
			.row label {
				font-size: 12.5px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.row.changed label::after {
				content: "•";
				color: var(--ui-warn);
				margin-left: 5px;
			}
			.row.linked label {
				color: var(--ui-dim);
			}
			.row .fields {
				display: flex;
				align-items: center;
				gap: 4px;
			}
			.swatch {
				width: 26px;
				height: 22px;
				padding: 0;
				border: 1px solid var(--ui-line);
				border-radius: 5px;
				background: none;
				cursor: pointer;
			}
			.swatch:disabled {
				cursor: default;
				opacity: 0.75;
			}
			.hex {
				width: 9ch;
				background: var(--ui-bg);
				border: 1px solid var(--ui-line);
				border-radius: 5px;
				color: var(--ui-fg);
				padding: 3px 5px;
				font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
				font-size: 11.5px;
			}
			.hex:disabled {
				color: var(--ui-dim);
				background: transparent;
			}
			.hex.wide {
				width: 15ch;
			}
			.alpha {
				width: 5ch;
				background: var(--ui-bg);
				border: 1px solid var(--ui-line);
				border-radius: 5px;
				color: var(--ui-dim);
				padding: 3px 4px;
				font-family: ui-monospace, Consolas, monospace;
				font-size: 11px;
			}
			.mini {
				width: 22px;
				height: 22px;
				border-radius: 5px;
				color: var(--ui-dim);
				display: grid;
				place-items: center;
				font-size: 12px;
				border: 1px solid transparent;
			}
			.mini:hover {
				background: var(--ui-raised);
				color: var(--ui-fg);
			}
			.mini[hidden] {
				display: none;
			}
			.mini.on {
				color: var(--ui-accent);
			}

			/* ---- preview scaffolding -------------------------------------------
			   Token names, radii, heights and tints below are taken from the real
			   components (components/base/*.tsx, app/globals.css): --radius 0.625rem,
			   rounded-2xl = radius * 1.8, cards min(radius-4xl, 24px), buttons h-8,
			   badges h-5, status fills are /10 tints in light and /18 in dark. */
			.frame {
				--radius: 0.625rem;
				--r-lg: var(--radius);
				--r-2xl: calc(var(--radius) * 1.8);
				--r-card: 24px;
				border: 1px solid var(--ui-line);
				border-radius: 10px;
				overflow: hidden;
				background: var(--background);
				color: var(--foreground);
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
				letter-spacing: -0.009em;
				font-size: 14px;
			}
			.frame + .caption {
				margin-top: 20px;
			}
			.caption {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--ui-dim);
				margin: 0 0 7px 2px;
			}
			.frame h1,
			.frame h2,
			.frame h3 {
				letter-spacing: -0.03em;
				font-weight: 600;
				margin: 0;
			}

			/* Buttons - cva recipe from components/base/button.tsx */
			.btn-c {
				height: 32px;
				padding: 0 12px;
				border-radius: var(--r-2xl);
				border: 1px solid transparent;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 6px;
				font-size: 14px;
				font-weight: 500;
				white-space: nowrap;
			}
			.btn-c.lg {
				height: 36px;
				padding: 0 16px;
			}
			.btn-c.sm {
				height: 28px;
				padding: 0 12px;
			}
			.btn-c.nav {
				border-radius: 999px;
			}
			.btn-c.default {
				background: var(--primary);
				color: var(--primary-foreground);
			}
			.btn-c.outline {
				border-color: var(--border);
				background: var(--card);
				color: var(--foreground);
			}
			.btn-c.secondary {
				background: var(--secondary);
				color: var(--secondary-foreground);
			}
			.btn-c.ghost {
				color: var(--foreground);
			}
			.btn-c.ghost.hovered {
				background: var(--ghost-hover);
			}
			.btn-c.destructive {
				background: color-mix(
					in oklab,
					var(--destructive) var(--tint),
					transparent
				);
				color: var(--destructive);
			}
			.btn-c.warning {
				background: color-mix(
					in oklab,
					var(--warning) var(--tint),
					transparent
				);
				color: var(--warning);
			}
			.btn-c.focused {
				border-color: var(--ring);
				box-shadow: 0 0 0 1px var(--ring);
			}

			/* Badges - components/base/badge.tsx */
			.chip {
				height: 20px;
				padding: 0 8px;
				border-radius: var(--r-2xl);
				border: 1px solid transparent;
				display: inline-flex;
				align-items: center;
				gap: 4px;
				font-size: 12px;
				font-weight: 500;
				white-space: nowrap;
			}
			.chip.success {
				background: color-mix(
					in oklab,
					var(--success) var(--tint),
					transparent
				);
				color: var(--success);
			}
			.chip.warning {
				background: color-mix(
					in oklab,
					var(--warning) var(--tint),
					transparent
				);
				color: var(--warning);
			}
			.chip.destructive {
				background: color-mix(
					in oklab,
					var(--destructive) var(--tint),
					transparent
				);
				color: var(--destructive);
			}
			.chip.info {
				background: color-mix(in oklab, var(--info) var(--tint), transparent);
				color: var(--info);
			}
			.chip.default {
				background: var(--primary);
				color: var(--primary-foreground);
			}
			.chip.secondary {
				background: var(--secondary);
				color: var(--secondary-foreground);
			}
			.chip.outline {
				border-color: var(--border);
				color: var(--foreground);
			}
			.chip i.dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: currentColor;
			}

			/* Cards, inputs - components/base/{card,input}.tsx */
			.card-c {
				background: var(--card);
				color: var(--card-foreground);
				border: 1px solid var(--border);
				border-radius: var(--r-card);
				padding: 20px;
				display: grid;
				gap: 12px;
				font-size: 14px;
			}
			.input-c {
				height: 32px;
				border-radius: var(--r-2xl);
				border: 1px solid var(--border);
				background: var(--card);
				color: var(--foreground);
				padding: 0 12px;
				font-size: 14px;
				display: flex;
				align-items: center;
				box-shadow: 0 1px 2px var(--shadow);
			}
			.input-c.focused {
				border-color: var(--ring);
				box-shadow: 0 0 0 1px var(--ring);
			}
			.input-c .ph {
				color: var(--muted-foreground);
			}
			.muted {
				color: var(--muted-foreground);
			}

			/* Site shell - components/{header,footer}.tsx */
			.site-header {
				height: 56px;
				max-width: 640px;
				margin: 0 auto;
				padding: 0 14px 0 10px;
				background: var(--card);
				border: 1px solid var(--border);
				border-top: 0;
				border-radius: 0 0 var(--r-2xl) var(--r-2xl);
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: center;
				gap: 24px;
			}
			.site-header .logo {
				display: flex;
				align-items: center;
				gap: 7px;
				font-weight: 600;
				font-size: 15px;
				letter-spacing: -0.02em;
			}
			.site-header nav {
				display: flex;
				gap: 2px;
			}
			.site-header .right {
				justify-self: end;
				display: flex;
				gap: 6px;
				align-items: center;
			}
			.site-body {
				max-width: 640px;
				margin: 0 auto;
				padding: 30px 14px 26px;
			}
			.hero h1 {
				font-size: 30px;
				line-height: 1.15;
				margin-bottom: 10px;
			}
			.hero p {
				margin: 0 0 18px;
				color: var(--muted-foreground);
				font-size: 15px;
			}
			.stack {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				align-items: center;
			}
			.section-title {
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--muted-foreground);
				margin: 24px 0 10px;
			}
			.grid2 {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
				gap: 14px;
			}
			.card-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
			}
			.kv {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 4px 14px;
				font-size: 13px;
				margin: 0;
			}
			.kv dt {
				color: var(--muted-foreground);
			}
			.kv dd {
				margin: 0;
			}
			.tbl {
				width: 100%;
				border-collapse: collapse;
				font-size: 13px;
			}
			.tbl th {
				text-align: left;
				font-weight: 500;
				color: var(--muted-foreground);
				padding: 8px 14px;
				border-bottom: 1px solid var(--border);
			}
			.tbl td {
				padding: 9px 14px;
				border-bottom: 1px solid var(--border);
			}
			.tbl tr:last-child td {
				border-bottom: 0;
			}
			.tbl tr.hovered td {
				background: var(--ghost-hover);
			}
			.menu {
				width: 220px;
				background: var(--popover);
				color: var(--popover-foreground);
				border: 1px solid var(--border);
				border-radius: var(--r-card);
				padding: 6px;
				box-shadow: 0 10px 30px var(--shadow);
			}
			.menu div {
				padding: 7px 10px;
				border-radius: var(--r-lg);
				font-size: 13.5px;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.menu div.hovered {
				background: var(--ghost-hover);
			}
			.menu div.danger {
				color: var(--destructive);
			}
			.menu .sep {
				height: 1px;
				padding: 0;
				margin: 5px 8px;
				background: var(--border);
			}
			.dialog-wrap {
				position: relative;
				border-radius: var(--r-card);
				overflow: hidden;
				background: var(--overlay);
				padding: 26px;
				display: grid;
				place-items: center;
			}
			.dialog {
				width: 100%;
				max-width: 360px;
				background: var(--popover);
				color: var(--popover-foreground);
				border: 1px solid var(--border);
				border-radius: var(--r-card);
				padding: 20px;
				display: grid;
				gap: 12px;
				box-shadow: 0 16px 44px var(--shadow);
			}
			.site-footer {
				background: var(--card);
				border-top: 1px solid var(--border);
				padding: 18px;
				display: flex;
				justify-content: space-between;
				font-size: 13px;
				color: var(--muted-foreground);
			}
			.chartbars {
				display: flex;
				align-items: flex-end;
				gap: 8px;
				height: 60px;
			}
			.chartbars i {
				width: 30px;
				border-radius: 4px 4px 0 0;
				display: block;
			}

			/* Docs - every fumadocs token resolves to one of ours */
			.docs {
				display: grid;
				grid-template-columns: 190px 1fr 150px;
				min-height: 260px;
			}
			.docs-side {
				background: var(--card);
				border-right: 1px solid var(--border);
				padding: 16px 10px;
			}
			.docs-side .t {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--muted-foreground);
				margin: 0 0 8px 10px;
			}
			.docs-side a {
				display: block;
				padding: 6px 10px;
				border-radius: var(--r-lg);
				font-size: 13.5px;
				color: var(--muted-foreground);
				text-decoration: none;
			}
			.docs-side a.on {
				background: var(--ghost-active);
				color: var(--foreground);
			}
			.docs-side a.hovered {
				background: var(--ghost-hover);
				color: var(--foreground);
			}
			.docs-main {
				padding: 18px 20px;
			}
			.docs-main h2 {
				font-size: 20px;
				margin-bottom: 8px;
			}
			.docs-main p {
				margin: 0 0 12px;
				color: var(--muted-foreground);
				font-size: 14px;
			}
			.pre {
				background: var(--popover);
				border: 1px solid var(--border);
				border-radius: var(--r-card);
				padding: 12px 14px;
				font-family: ui-monospace, Consolas, monospace;
				font-size: 12.5px;
				line-height: 1.6;
				overflow-x: auto;
				white-space: pre;
			}
			.callout {
				border: 1px solid var(--border);
				border-radius: var(--r-card);
				background: color-mix(in oklab, var(--info) var(--tint), transparent);
				padding: 12px 14px;
				margin-top: 12px;
				font-size: 13.5px;
				display: flex;
				gap: 10px;
			}
			.callout .i {
				color: var(--info);
			}
			.toc {
				padding: 16px 12px;
				font-size: 13px;
				color: var(--muted-foreground);
				border-left: 1px solid var(--border);
				display: grid;
				gap: 7px;
				align-content: start;
			}
			.toc .on {
				color: var(--foreground);
			}

			/* Mobile */
			.phones {
				display: flex;
				gap: 20px;
				flex-wrap: wrap;
			}
			.phone {
				width: 280px;
				border-radius: 30px;
				border: 1px solid var(--border);
				background: var(--background);
				color: var(--foreground);
				overflow: hidden;
				box-shadow: 0 12px 34px #0006;
				font-size: 14px;
			}
			.phone .statusbar {
				height: 30px;
				background: var(--card);
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 14px;
				font-size: 11px;
				color: var(--muted-foreground);
			}
			.phone .apphead {
				background: var(--card);
				border-bottom: 1px solid var(--border);
				padding: 12px 14px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.phone .apphead .title {
				font-weight: 600;
				letter-spacing: -0.02em;
				font-size: 16px;
			}
			.phone .body {
				padding: 12px;
				display: grid;
				gap: 10px;
			}
			.phone .tile {
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: var(--r-card);
				padding: 12px 14px;
				display: grid;
				gap: 6px;
			}
			.phone .tile .n {
				font-weight: 500;
			}
			.phone .sheet {
				background: var(--popover);
				color: var(--popover-foreground);
				border-top: 1px solid var(--border);
				border-radius: var(--r-card) var(--r-card) 0 0;
				padding: 14px;
				display: grid;
				gap: 9px;
				box-shadow: 0 -8px 30px var(--shadow);
			}
			.phone .grab {
				width: 36px;
				height: 4px;
				border-radius: 2px;
				background: var(--muted-foreground);
				opacity: 0.45;
				margin: 0 auto 6px;
			}
			.phone .webview {
				height: 96px;
				background: var(--ide-editor);
				border-top: 1px solid var(--border);

	<body>
		<header class="bar">

		<main>

			<div class="preview-pane">

					<button data-view="docs" aria-pressed="false">Docs</button>
					<button data-view="mobile" aria-pressed="false">Mobile</button>
					<button data-view="ide" aria-pressed="false">Editor</button>

				</div>
				<div class="stage" id="stage"></div>
			</div>
		</main>

		<script type="module">
			const GROUPS = [
				{
					id: "page",
					title: "Page",
					open: true,
					note: "The base layer everything else sits on.",
					fields: [
						["theme", "background", "Background"],
						["theme", "foreground", "Text"]
					]
				},
				{
					id: "surfaces",
					title: "Raised surfaces",
					open: true,
					note: "Header, footer, docs sidebar, cards, inputs and the outline button take `card`; menus, dialogs and sheets take `popover`. Both sit above the page.",
					fields: [
						["theme", "card", "Surface"],
						["theme", "cardForeground", "Surface text"],
						["theme", "popover", "Floating surface"],
						["theme", "popoverForeground", "Floating text"]
					]
				},
				{
					id: "interactive",
					title: "Interactive",
					open: true,
					note: "Ghost hovers are mixed from the text colour, so they follow it instead of needing a role of their own.",
					fields: [
						["theme", "primary", "Primary"],
						["theme", "primaryForeground", "On primary"],
						["theme", "secondary", "Secondary"],
						["theme", "secondaryForeground", "On secondary"],
						["theme", "accent", "Hover / selected"],
						["theme", "accentForeground", "On hover"],
						["theme", "muted", "Muted fill"],
						["theme", "mutedForeground", "Muted text"]
					]
				},
				{
					id: "status",
					title: "Status",
					open: true,
					note: "Box status chips, validation, git decorations and the diff gutter. A chip paints a 10% tint of these in light and 18% in dark, with the colour itself as the label - so these have to read against their own tint.",
					fields: [
						["theme", "success", "Success"],
						["theme", "warning", "Warning"],
						["theme", "destructive", "Destructive"],
						["theme", "info", "Info"]
					]
				},
				{
					id: "edges",
					title: "Edges, focus & depth",
					open: true,
					note: "The second box is the alpha byte - borders and shadows are translucent so they work over any surface.",
					fields: [
						["theme", "border", "Border"],
						["theme", "input", "Input border"],
						["theme", "ring", "Focus ring"],
						["theme", "shadow", "Shadow"],
						["theme", "overlay", "Dialog scrim"]
					]
				},
				{
					id: "ide-chrome",
					title: "Editor chrome",
					open: true,
					note: "The editor keeps its chrome flush with the canvas rather than raised like the site. A chained row follows the site role it names - click the chain to give it a value of its own.",
					fields: [
						["ide", "editor", "Canvas"],
						["ide", "chrome", "Bars & side bar"],
						["ide", "surface", "Tab strip & inputs"],
						["ide", "hover", "Row hover / selection"],
						["ide", "lineNumber", "Line numbers"],
						["ide", "focus", "Focus border"],
						["ide", "ignored", "Ignored files"]
					]
				},
				{
					id: "syntax",
					title: "Syntax",
					open: true,
					fields: [
						["ide", "keyword", "Keyword"],
						["ide", "string", "String"],
						["ide", "number", "Number / call"],
						["ide", "type", "Type / tag"],
						["ide", "variable", "Variable"],
						["ide", "punctuation", "Punctuation"],
						["ide", "comment", "Comment"],
						["ide", "invalid", "Invalid"]
					]
				},
				{
					id: "ansi",
					title: "Terminal ANSI",
					open: false,
					note: "Bright variants reuse these; bright white takes the editor text colour.",
					fields: [
						["ide", "ansiBlack", "Black"],
						["ide", "ansiRed", "Red"],
						["ide", "ansiGreen", "Green"],
						["ide", "ansiYellow", "Yellow"],
						["ide", "ansiBlue", "Blue"],
						["ide", "ansiMagenta", "Magenta"],
						["ide", "ansiCyan", "Cyan"],
						["ide", "ansiWhite", "White"],
						["ide", "ansiBrightBlack", "Bright black"]
					]
				},
				{
					id: "charts",
					title: "Charts",
					open: false,
					fields: [
						["theme", "chart1", "Series 1"],
						["theme", "chart2", "Series 2"],
						["theme", "chart3", "Series 3"],
						["theme", "chart4", "Series 4"],
						["theme", "chart5", "Series 5"]
					]
				}
			];

			const $ = (sel, root = document) => root.querySelector(sel);
			const clone = (value) => JSON.parse(JSON.stringify(value));
			const el = (tag, props = {}, kids = []) => {
				const node = Object.assign(document.createElement(tag), props);
				for (const kid of [].concat(kids))
					node.append(kid?.nodeType ? kid : document.createTextNode(kid));
				return node;
			};
			const escape = (text) =>
				text.replace(/&/g, "&amp;").replace(/</g, "&lt;");

			const parse = (value) => {
				const hex = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(value ?? "");
				if (!hex) return { kind: "raw", raw: value ?? "" };
				return { kind: "hex", hex: "#" + hex[1].toLowerCase(), alpha: hex[2] };
			};
			const compose = (parsed) =>
				parsed.kind === "raw" ? parsed.raw : parsed.hex + (parsed.alpha ?? "");

			const luminance = (hex) => {
				const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(hex);
				if (!m) return null;
				const [r, g, b] = m.slice(1).map((h) => {
					const c = parseInt(h, 16) / 255;
					return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
				});
				return 0.2126 * r + 0.7152 * g + 0.0722 * b;
			};
			const contrast = (a, b) => {
				const la = luminance(a);
				const lb = luminance(b);
				if (la === null || lb === null) return null;
				return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
			};
			// Flatten #rrggbbaa over a backdrop so the contrast numbers describe what
			// the eye sees rather than the literal token.
			const over = (value, backdrop) => {
				const p = parse(value);
				if (p.kind !== "hex" || !p.alpha) return value;
				const a = parseInt(p.alpha, 16) / 255;
				const channels = (s) =>
					[1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
				const [r1, g1, b1] = channels(p.hex);
				const [r2, g2, b2] = channels(backdrop.slice(0, 7));
				const mix = (x, y) => Math.round(x * a + y * (1 - a));
				return (
					"#" +
					[mix(r1, r2), mix(g1, g2), mix(b1, b2)]
						.map((n) => n.toString(16).padStart(2, "0"))
						.join("")
				);
			};

			let disk = null;
			let state = null;
			let links = {};
			let history = [];
			let cursor = -1;
			let scheme = "light";
			let view = "site";

			const isLinked = (kind, key) =>
				kind === "ide" && state.linked[scheme].includes(key);
			// A linked role has no value of its own: it shows, and writes, its source.
			const get = (kind, key) =>
				isLinked(kind, key)
					? state.theme[scheme][links[key]]
					: state[kind][scheme][key];
			const onDisk = (kind, key) =>
				kind === "ide" && disk.linked[scheme].includes(key)
					? disk.theme[scheme][links[key]]
					: disk[kind][scheme][key];

			function pushHistory() {
				history = history.slice(0, cursor + 1);
				history.push(clone(state));
				cursor = history.length - 1;
				sync();
			}

			function setValue(kind, key, value) {
				if (isLinked(kind, key)) return; // the source owns it
				state[kind][scheme][key] = value;
				// Linked roles are kept equal to their source as it moves, so what the
				// console shows is what apply will write. Comparing against the last
				// committed value instead would drop the link mid-drag, when the picker
				// fires input events faster than history is written.
				if (kind === "theme")
					for (const role of state.linked[scheme])
						if (links[role] === key) state.ide[scheme][role] = value;
				render();
			}

			function toggleLink(key) {
				const list = state.linked[scheme];
				const index = list.indexOf(key);
				// Either way the value stays what it was showing; only ownership moves.
				state.ide[scheme][key] = state.theme[scheme][links[key]];
				if (index >= 0) list.splice(index, 1);
				else list.push(key);
				pushHistory();
				render();
			}

			const isDirty = () =>
				JSON.stringify([state.theme, state.ide, state.linked]) !==
				JSON.stringify([disk.theme, disk.ide, disk.linked]);

			function sync() {
				$("#undo").disabled = cursor <= 0;
				$("#redo").disabled = cursor >= history.length - 1;
				document.body.classList.toggle("dirty", isDirty());
				$("#revert").disabled = !isDirty();
			}

			function buildControls() {
				const host = $("#controls");
				host.textContent = "";
				for (const group of GROUPS) {
					const details = el("details", {
						className: "group",
						open: group.open
					});
					details.append(el("summary", {}, group.title));
					if (group.note)
						details.append(el("div", { className: "group-note" }, group.note));
					for (const [kind, key, label] of group.fields)
						details.append(buildRow(kind, key, label));
					host.append(details);
				}

			function buildRow(kind, key, label) {
				const row = el("div", { className: "row" });
				row.dataset.kind = kind;
				row.dataset.key = key;
				row.append(el("label", {}, label));

				const fields = el("div", { className: "fields" });
				const swatch = el("input", { type: "color", className: "swatch" });
				const hex = el("input", { className: "hex", spellcheck: false });
				const alpha = el("input", { className: "alpha", spellcheck: false });
				const reset = el(
					"button",
					{ className: "mini", title: "Reset to the value on disk" },
					"⟲"
				);
				const chain = el("button", { className: "mini" }, "⛓");

				const commit = (value) => {
					setValue(kind, key, value);
					pushHistory();
				};
				// The OS picker fires input continuously while dragging: paint every
				// frame, but put a single entry on the undo stack when it closes.
				swatch.addEventListener("input", () =>
					setValue(
						kind,
						key,
						compose({ ...parse(get(kind, key)), hex: swatch.value })
					)
				);
				swatch.addEventListener("change", () => pushHistory());
				hex.addEventListener("change", () => {
					const raw = hex.value.trim();
					const valid =
						/^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(raw) || /^rgba?\(/.test(raw);
					if (!valid) return render();
					commit(raw);
				});
				alpha.addEventListener("change", () => {
					const raw = alpha.value.trim().toLowerCase();
					if (!/^[0-9a-f]{0,2}$/.test(raw)) return render();
					commit(
						compose({
							...parse(get(kind, key)),
							alpha: raw === "" ? undefined : raw.padStart(2, "0")
						})
					);
				});
				reset.addEventListener("click", () => commit(onDisk(kind, key)));
				chain.addEventListener("click", () => toggleLink(key));

				fields.append(swatch, hex, alpha, reset, chain);
				row.append(fields);

				row._paint = () => {
					const value = get(kind, key);
					const parsed = parse(value);
					const linked = isLinked(kind, key);
					const changed =
						value !== onDisk(kind, key) ||
						(links[key] && linked !== disk.linked[scheme].includes(key));

					row.classList.toggle("changed", Boolean(changed));
					row.classList.toggle("linked", linked);
					swatch.value = parsed.kind === "hex" ? parsed.hex : "#000000";
					swatch.disabled = parsed.kind !== "hex" || linked;
					hex.value = parsed.kind === "hex" ? parsed.hex : parsed.raw;
					hex.disabled = linked;
					hex.classList.toggle("wide", parsed.kind !== "hex");
					alpha.hidden = parsed.kind !== "hex" || linked;
					alpha.value = parsed.alpha ?? "";
					alpha.placeholder = "ff";
					reset.hidden = !changed;

					chain.hidden = !links[key];
					if (links[key]) {
						chain.classList.toggle("on", linked);
						chain.title = linked
							? `Follows ${links[key]} - click to give it its own value`
							: `Link to ${links[key]} (${state.theme[scheme][links[key]]})`;
					}
				};
				return row;
			}

<span style="color:var(--success)">✓</span> 862 tests passed
<span style="color:var(--warning)">⚠</span> 2 files need formatting
<span style="color:var(--destructive)">✗</span> check:format failed
<span style="color:var(--ide-line-number)">────────────────────</span>
<span class="ansi-strip"><i style="background:var(--ansi-black)" title="black"></i><i style="background:var(--ansi-red)" title="red"></i><i style="background:var(--ansi-green)" title="green"></i><i style="background:var(--ansi-yellow)" title="yellow"></i><i style="background:var(--ansi-blue)" title="blue"></i><i style="background:var(--ansi-magenta)" title="magenta"></i><i style="background:var(--ansi-cyan)" title="cyan"></i><i style="background:var(--ansi-white)" title="white"></i><i style="background:var(--ansi-brightblack)" title="brightblack"></i></span></div>
							</div>

					<div class="statusbar">
						<span>⎇ main*</span>
						<span>↻ 0↓ 2↑</span>
						<span style="color:var(--destructive)">✗ 1</span>

			function tokensView() {
				const t = state.theme[scheme];
				const ide = Object.fromEntries(
					Object.keys(state.ide[scheme]).map((key) => [key, get("ide", key)])
				);
				const swatches = [
					...Object.entries(t),
					...Object.entries(ide).map(([key, value]) => ["ide." + key, value])
				];
				// A chip label sits on its own tint, not on the bare surface, so that
				// is the backdrop its ratio has to be measured against.
				const tintByte = scheme === "dark" ? "2e" : "1a";
				const tinted = (colour, backdrop) => over(colour + tintByte, backdrop);
				const pairs = [
					["Text on page", t.foreground, t.background],
					["Muted text on page", t.mutedForeground, t.background],
					["Text on surface", t.cardForeground, t.card],
					["Muted text on surface", t.mutedForeground, t.card],
					["Text on floating surface", t.popoverForeground, t.popover],
					["On primary", t.primaryForeground, t.primary],
					["On secondary", t.secondaryForeground, t.secondary],
					["Success chip label", t.success, tinted(t.success, t.card)],
					["Warning chip label", t.warning, tinted(t.warning, t.card)],
					[
						"Destructive chip label",
						t.destructive,
						tinted(t.destructive, t.card)
					],
					["Info chip label", t.info, tinted(t.info, t.card)],
					["Border over page", over(t.border, t.background), t.background],
					["Editor text", t.foreground, ide.editor],
					["Line numbers", ide.lineNumber, ide.editor],
					["Comment", ide.comment, ide.editor],
					["Keyword", ide.keyword, ide.editor],
					["String", ide.string, ide.editor],
					["Number", ide.number, ide.editor],
					["Type", ide.type, ide.editor],
					["Punctuation", ide.punctuation, ide.editor],
					["Invalid", ide.invalid, ide.editor],
					["Ignored files", ide.ignored, ide.chrome]
				];
				const rows = pairs
					.map(([label, fg, bg]) => {
						const ratio = contrast(over(fg, bg), bg);
						if (ratio === null) return "";
						const cls = ratio >= 4.5 ? "ok" : ratio >= 3 ? "warn" : "bad";
						const verdict =
							ratio >= 4.5
								? "AA text"
								: ratio >= 3
									? "large / UI only"
									: "below 3:1";
						return `<tr><td>${label}</td><td style="font-family:ui-monospace">${fg}</td><td class="${cls}">${ratio.toFixed(2)}:1</td><td class="${cls}">${verdict}</td></tr>`;
					})
					.join("");
				return `
					<p class="caption">Every token in this scheme</p>
					<div class="swatchgrid">
						${swatches
							.map(
								([key, value]) =>
									`<figure><div class="fill" style="background:${value}"></div><figcaption>${key}<br>${value}</figcaption></figure>`
							)
							.join("")}
					</div>
					<p class="caption" style="margin-top:20px">Contrast — alpha and chip tints flattened over their real backdrop</p>
					<table class="contrast"><thead><tr><th>Pair</th><th>Colour</th><th>Ratio</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
			}

			function render() {
				for (const row of document.querySelectorAll(".row")) row._paint();
				const stage = $("#stage");
				stage.textContent = "";
				const section = el("section");
				section.innerHTML =
					view === "site"
						? SITE
						: view === "docs"
							? DOCS
							: view === "mobile"
								? MOBILE
								: view === "ide"
									? IDE()
									: tokensView();
				stage.append(section);
				paintVars(section);
				sync();
			}

			$("#scheme").addEventListener("click", (event) => {
				const button = event.target.closest("button");
				if (!button) return;
				scheme = button.dataset.scheme;
				for (const other of $("#scheme").children)
					other.setAttribute("aria-pressed", String(other === button));
				render();
			});
			$("#tabs").addEventListener("click", (event) => {
				const button = event.target.closest("button");
				if (!button) return;
				view = button.dataset.view;
				for (const other of $("#tabs").children)
					other.setAttribute("aria-pressed", String(other === button));
				render();
			});

			const jump = (delta) => {
				const next = cursor + delta;
				if (next < 0 || next >= history.length) return;
				cursor = next;
				state = clone(history[cursor]);
				render();
			};
			$("#undo").addEventListener("click", () => jump(-1));
			$("#redo").addEventListener("click", () => jump(1));
			$("#revert").addEventListener("click", () => {
				state = clone(disk);
				pushHistory();
				render();
			});
			addEventListener("keydown", (event) => {
				if (!(event.ctrlKey || event.metaKey)) return;
				const key = event.key.toLowerCase();
				if (key === "z") {
					event.preventDefault();
					jump(event.shiftKey ? 1 : -1);
				} else if (key === "y") {
					event.preventDefault();
					jump(1);
				} else if (key === "s") {
					event.preventDefault();
					$("#apply").click();
				}
			});

			$("#apply").addEventListener("click", async () => {
				const status = $("#status");
				status.className = "status";
				status.textContent = "applying…";
				$("#apply").disabled = true;
				try {
					const response = await fetch("/api/apply", {
						method: "POST",
						body: JSON.stringify({
							theme: state.theme,
							ide: state.ide,
							linked: state.linked
						})
					});
					const result = await response.json();
					if (!result.ok) throw new Error(result.error);
					disk = clone(state);
					status.textContent = `applied · ${result.stats.light.ui + result.stats.dark.ui} editor keys`;
					render();
				} catch (error) {
					status.className = "status err";
					status.textContent = String(error.message ?? error).slice(0, 90);
				} finally {
					$("#apply").disabled = false;
				}
			});

			const loaded = await (await fetch("/api/state")).json();
			links = loaded.links;
			disk = clone(loaded);
			state = clone(loaded);
			history = [clone(state)];
			cursor = 0;
			buildControls();
			render();
		</script>
	</body>
